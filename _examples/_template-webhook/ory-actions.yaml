# Ory Network doesn't accept file:// bodies. Encode the template with
# `base64 < jsonnet/identity.jsonnet | tr -d '\n'` and paste it after base64://.
#
# response.ignore: true sends the request in the background. To change the
# identity or block the flow instead, replace it with response.parse: true and
# return the response shapes described in the README.

selfservice:
  flows:
    registration:
      after:
        password:
          hooks: &registration_after_hooks
            - hook: web_hook
              config:
                url: https://your-deployed-handler.example.com/<integration>/sync-user
                method: POST
                body: base64://<base64-encoded jsonnet/identity.jsonnet>
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: <your-shared-secret>
                    in: header
                response:
                  ignore: true
            - hook: session
        oidc:
          hooks: *registration_after_hooks
        code:
          hooks: *registration_after_hooks
        passkey:
          hooks: *registration_after_hooks
        webauthn:
          hooks: *registration_after_hooks
        # The password list is aliased into the oidc, code, passkey, and webauthn
        # lists. Alias it into any other method you enable, such as saml.
