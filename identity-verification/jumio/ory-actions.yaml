# Jumio identity-verification hooks.
#
# Two Ory-side hooks: - post-registration → /jumio/initiate    starts a Jumio
# workflow, writes the Jumio account ID into metadata. - post-login       →
# /jumio/validate     blocks the login when the stored verification status is
# rejected.
#
# Ory Kratos Identities runs the flow-level after.hooks list only for a method
# that has no hooks of its own, so the hooks go in the method lists. The
# password lists are aliased into the oidc, code, passkey, and webauthn lists,
# so every sign-in method runs the same hooks. Alias them into any other
# method you enable, such as saml, the same way.
#
# The initiate hook has no response.parse, so it runs after the identity is
# saved and receives the real identity ID. response.ignore makes it run in the
# background so the Jumio call doesn't delay sign-up.
#
# On Ory Network, replace each file:// body with
# base64://<base64-encoded-jsonnet>.
#
# Jumio also posts back to /jumio/callback when the workflow finishes; that
# endpoint is gated by an HMAC-SHA256 signature in X-Jumio-Signature, not by
# this Ory webhook secret.

selfservice:
  flows:
    registration:
      after:
        password:
          hooks: &registration_after_hooks
            - hook: web_hook
              config:
                url: https://your-deployed-handler.example.com/jumio/initiate
                method: POST
                body: file://./jsonnet/initiate.jsonnet
                response:
                  ignore: true
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: <your-shared-secret>
                    in: header
            - hook: session
        oidc:
          hooks: *registration_after_hooks
        code:
          hooks: *registration_after_hooks
        passkey:
          hooks: *registration_after_hooks
        webauthn:
          hooks: *registration_after_hooks
    login:
      after:
        password:
          hooks: &login_after_hooks
            - hook: web_hook
              config:
                url: https://your-deployed-handler.example.com/jumio/validate
                method: POST
                body: file://./jsonnet/validate.jsonnet
                response:
                  parse: true
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: <your-shared-secret>
                    in: header
        oidc:
          hooks: *login_after_hooks
        code:
          hooks: *login_after_hooks
        passkey:
          hooks: *login_after_hooks
        webauthn:
          hooks: *login_after_hooks
