# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: jumio
displayName: Jumio
vendor: Jumio
category: identity-verification
type: webhook
maintainedBy: Ory Engineering
description: >-
  Run Jumio identity verification (Document + Selfie + Face Match) from an Ory Action after registration; consume
  Jumio's HMAC-signed callback when the workflow finishes and gate login on the stored verification status.
  Common in regulated industries (financial services, healthcare, gambling, crypto) for high-assurance KYC.
useCase: >-
  A regulated B2C product (fintech, crypto, online gambling, regulated healthcare) needs document + biometric
  KYC at signup with a vendor that's already on most regulators' approved lists.
coreFunctionality: |-
  - Three endpoints: POST /jumio/initiate (registration.after without response.parse, after the identity is saved; starts workflow with customerInternalReference = Ory identity id); POST /jumio/callback (async from Jumio; HMAC-SHA256 verified; writes the decision to metadata_public); POST /jumio/validate (login.after with response.parse; blocks rejected identities with a 403 and a messages body).
  - customerInternalReference is the binding between Jumio workflow and Kratos identity — set on initiate, consumed on callback.
  - Identity-side state stored in metadata_public via @ory/client (IdentityApi.getIdentity + patchIdentity).
  - Hooks go in the method-specific lists (after.password.hooks, after.oidc.hooks, ...) — no Kratos schema changes required.
  - SDK: @ory/client for Kratos admin API; native fetch for Jumio API.
oryMechanism:
  - actions
protocol:
  - rest-api
  - oauth2
  - http-webhook
status: active
