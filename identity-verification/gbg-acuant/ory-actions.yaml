# GBG GO journey verification at registration.
#
# The action runs before the identity is saved (response.parse: true), so the
# handler can reject the registration or return metadata to store with the new
# identity. The password lists are aliased into the oidc, code, passkey, and
# webauthn lists, so every sign-in method runs the same hooks. Alias them into
# any other method you enable, such as saml, the same way.

selfservice:
  flows:
    registration:
      after:
        password:
          hooks: &registration_after_hooks
            - hook: web_hook
              config:
                url: https://your-deployed-handler.example.com/gbg/verify-identity
                method: POST
                body: file://./jsonnet/identity.jsonnet
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: <your-shared-secret>
                    in: header
                response:
                  parse: true
            - hook: session
        oidc:
          hooks: *registration_after_hooks
        code:
          hooks: *registration_after_hooks
        passkey:
          hooks: *registration_after_hooks
        webauthn:
          hooks: *registration_after_hooks
