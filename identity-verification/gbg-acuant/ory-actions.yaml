hooks:
  - hook: web_hook
    config:
      url: https://your-deployed-handler.example.com/gbg/verify-identity
      method: POST
      body: file://./jsonnet/identity.jsonnet
      auth:
        type: api_key
        config:
          name: X-Webhook-Secret
          value: <your-shared-secret>
          in: header
      response:
        ignore: false   # we want the verification result back to gate registration
        parse: true
