# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: gbg-acuant
displayName: GBG (Acuant)
vendor: GBG (Acuant)
category: identity-verification
type: webhook
maintainedBy: Community contributors
description: >-
  Run GBG (which acquired Acuant) identity verification — document + biometric — from an Ory Actions webhook
  during registration. Calls the GBG GO Journey API, returns the GBG decision (PASS / REFER / FAIL) so Ory can
  gate the registration flow, and writes the verdict to identity metadata for downstream policy.
useCase: >-
  A regulated product wants document + biometric identity verification with GBG's deep international document
  coverage (long Acuant heritage), wired into a configurable GBG "journey" so the same Ory action can back
  several risk levels by swapping the journey id.
coreFunctionality: |-
  - One sync endpoint POST /gbg/verify-identity called from registration.after with response.parse: true so Ory consumes the GBG decision directly.
  - GBG-side flow defined as a "journey" (journey id is required); journey definition controls which evidence types are required (document, selfie, address, etc.).
  - Decision values: PASS / REFER / FAIL — the action fails the registration on REFER/FAIL, or writes the verdict into identity.metadata for downstream policy.
  - Authenticated via X-Webhook-Secret shared with the Ory hook config.
  - First-call cold-path latency can be 5-10s; handler caps at 15s.
oryMechanism:
  - actions
protocol:
  - rest-api
status: active
