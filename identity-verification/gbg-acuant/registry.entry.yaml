name: gbg-acuant
displayName: GBG (Acuant)
vendor: GBG (Acuant)
category: identity-verification
type: webhook
maintainedBy: Community contributors
description: >-
  GBG (which acquired Acuant) is a global identity verification provider with deep document and biometric coverage. This
  integration calls the GBG identity verification API from an Ory Actions webhook during registration to verify document
  + selfie evidence, and writes the verification outcome back into the Ory identity for downstream policy decisions.
oryMechanism:
  - actions-webhook
status: active
