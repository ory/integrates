# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: prove
displayName: Prove
vendor: Prove (formerly Payfone)
category: identity-verification
type: webhook
maintainedBy: Ory Engineering
description: >-
  Phone-anchored identity verification — telecom signals and continuous phone-ownership verification — at two
  Ory Actions lifecycle points: post-registration enrollment and per-login validation.
useCase: >-
  A US-focused product wants ongoing phone-ownership verification so a changed or SIM-swapped phone can't be
  used to resume an existing account.
coreFunctionality: |-
  - Two endpoints: POST /prove/enroll (registration.after without response.parse, after the identity is saved — enroll phone with Prove Identity Manager, store prove_identity_id in metadata_public), POST /prove/validate (login.after with response.parse — confirm the phone on file still matches, block on a mismatch).
  - Prove's APIs return decisions in the response, no async callbacks. Prefill isn't covered: a registration.before action has no phone number or traits.
  - Phone collection is a prerequisite — identity schema must capture an E.164 phone number.
  - Identity-side state stored in metadata_public via @ory/client (IdentityApi.getIdentity + patchIdentity), because the webhook payload has no metadata_admin.
  - Uses Prove's official SDK (@prove-identity/prove-api) for the API surface.
  - Defaults to UAT (platform.uat.proveapis.com); override PROVE_SERVER_URL for production.
oryMechanism:
  - actions
protocol:
  - rest-api
  - oauth2
status: active
