# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: socure
displayName: Socure
vendor: Socure
category: identity-verification
type: webhook
maintainedBy: Community contributors
description: >-
  Run Socure ID+ (ML-based identity verification with strong fraud signals — device fingerprint, email
  reputation, network risk, KYC, phone risk) from an Ory Action webhook during registration. Supports both the
  sync path (Socure returns a verdict immediately) and the async path (Socure POSTs the final verdict back to
  /socure/results-callback when long-running checks complete).
useCase: >-
  A regulated B2C product needs ML-driven identity verification at signup with strong fraud signals beyond
  document checks — device, email, network, phone risk — and wants a single deployment that handles both
  fast and slow Socure verdict paths.
coreFunctionality: |-
  - Sync path: POST /socure/verify-identity (registration action with response.parse: true); calls Socure ID+ POST /api/3.0/EmailAuthScore with configured SOCURE_MODULES and the handler's own reference as customerUserId; rejects the registration with a messages response when the decision is reject or the fraud score reaches SOCURE_FRAUD_THRESHOLD, otherwise returns the reference as external_id.
  - Async path: POST /socure/results-callback (FROM Socure when async checks complete); HMAC-SHA256 over raw body via X-Socure-Signature; when ORY_SDK_URL + ORY_ADMIN_API_KEY are set, finds the identity by external_id and writes the final decision to metadata_public.socure_decision.
  - SOCURE_MODULES configures which signals run (commonly kyc, fraud, phonerisk).
  - Single deployment, single binary handles both paths — async config is optional.
  - Authenticated via shared ORY_WEBHOOK_SECRET (sync) and SOCURE_CALLBACK_SECRET (async HMAC).
oryMechanism:
  - actions
protocol:
  - rest-api
  - http-webhook
status: active
