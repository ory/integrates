# Persona identity-verification hooks.
#
# Ory doesn't relay webhook responses to the browser, so the recommended path
# is for your backend to call /persona/initiate after sign-up and send the
# user to the returned verification_url. The registration hook below is the
# alternative: it creates the inquiry from an Ory Action, and your backend
# reads persona_inquiry_id from metadata_public afterward.
#
# The registration hook has no response.parse, so it runs after the identity
# is saved and receives the real identity ID. response.ignore makes it run in
# the background.
#
# Ory Kratos Identities runs the flow-level after.hooks list only for a method
# that has no hooks of its own, so the hooks go in the method lists. The
# password lists are aliased into the oidc, code, passkey, and webauthn lists,
# so every sign-in method runs the same hooks. Alias them into any other
# method you enable, such as saml, the same way.
#
# On Ory Network, replace each file:// body with
# base64://<base64-encoded-jsonnet>.
#
# Persona also POSTs back to /persona/callback; that endpoint is gated by the
# Persona-Signature header, not by this Ory webhook secret.

selfservice:
  flows:
    registration:
      after:
        password:
          hooks: &registration_after_hooks
            - hook: web_hook
              config:
                url: https://your-deployed-handler.example.com/persona/initiate
                method: POST
                body: file://./jsonnet/initiate.jsonnet
                response:
                  ignore: true
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: <your-shared-secret>
                    in: header
            - hook: session
        oidc:
          hooks: *registration_after_hooks
        code:
          hooks: *registration_after_hooks
        passkey:
          hooks: *registration_after_hooks
        webauthn:
          hooks: *registration_after_hooks
    login:
      after:
        password:
          hooks: &login_after_hooks
            - hook: web_hook
              config:
                url: https://your-deployed-handler.example.com/persona/validate
                method: POST
                body: file://./jsonnet/validate.jsonnet
                response:
                  parse: true
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: <your-shared-secret>
                    in: header
        oidc:
          hooks: *login_after_hooks
        code:
          hooks: *login_after_hooks
        passkey:
          hooks: *login_after_hooks
        webauthn:
          hooks: *login_after_hooks
