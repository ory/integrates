# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: persona
displayName: Persona
vendor: Persona
category: identity-verification
type: webhook
maintainedBy: Ory Engineering
description: >-
  Run Persona identity verification (configurable templates — document capture, selfie + liveness, database
  checks, watchlist screening) after registration; consume Persona's HMAC-signed callback
  when the inquiry changes status and gate login on the stored verification status.
useCase: >-
  A regulated B2C product needs identity verification at signup tailored to product risk — Persona's templates
  let the same handler back KYC-light onboarding (document + selfie) and high-trust flows (with database
  verification + watchlist) without changing code.
coreFunctionality: |-
  - Three endpoints: POST /persona/initiate (called by the application backend after sign-up, or registration.after without response.parse; creates Inquiry with reference-id = Ory identity id; returns hosted URL); POST /persona/callback (async from Persona; Persona-Signature t=,v1= HMAC-SHA256 over "<t>.<raw body>"; writes the status to metadata_public); POST /persona/validate (login.after with response.parse; blocks login when status == declined).
  - Identity-side state stored in metadata_public via @ory/client (IdentityApi.getIdentity + patchIdentity), because the webhook payload has no metadata_admin.
  - Reference-id is the binding between Persona Inquiry and Kratos identity — set on initiate, consumed on callback.
  - Hooks go in the method-specific lists (after.password.hooks, after.oidc.hooks, ...) — no Kratos schema changes required.
  - SDK: @ory/client for Kratos admin API; native fetch for Persona API.
oryMechanism:
  - actions
protocol:
  - rest-api
  - http-webhook
status: active
