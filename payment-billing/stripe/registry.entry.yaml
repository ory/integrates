# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: stripe
displayName: Stripe
vendor: Stripe
category: payment-billing
type: webhook
maintainedBy: Community contributors
description: >-
  Stripe is a payment-processing and subscription-billing platform. This integration creates a Stripe Customer for every
  Ory identity on registration and keeps the identity's metadata_public.stripe in sync with Stripe subscription
  webhooks, so the application can gate features by plan without an extra round trip to Stripe.
useCase: >-
  A SaaS product wants its session to know "is this user on Free, Pro, or Enterprise?" without each protected route
  reading from Stripe directly. The integration links the Stripe Customer to the Ory identity at registration and
  mirrors subscription changes onto the identity, so feature gates, billing pages, and admin tools can read
  session.identity.metadata_public.stripe instead of calling Stripe.
coreFunctionality: |-
  - Asynchronous post-registration Ory Action (response.ignore: true) in the registration method lists: stripe.customers.create with metadata.ory_identity_id and the idempotency key ory-customer-<identity id>, then writes metadata_public.stripe.customer_id with a JSON Patch through the Ory Admin API.
  - Stripe webhook endpoint verifies the Stripe-Signature header over the raw body and handles customer.subscription.created, updated, and deleted.
  - Resolves the Ory identity from the Stripe Customer's metadata.ory_identity_id and writes subscription_state, plan, and current_period_end under metadata_public.stripe.
  - Treats each event as a trigger and writes the subscription state retrieved from Stripe, serialized per identity, because Stripe delivers events at least once and out of order.
  - Stripe API version pinned via STRIPE_API_VERSION env; bumps are explicit decisions, not silent updates.
oryMechanism:
  - actions
protocol:
  - rest-api
  - http-webhook
status: active
