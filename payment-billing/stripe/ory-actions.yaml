# Stripe Customer creation hook.
#
# Asynchronous (response.ignore: true): the hook runs after the identity is
# saved, and Stripe availability never blocks registration. Encode the body
# template with `base64 < jsonnet/registration.jsonnet | tr -d '\n'`.
#
# The password list is aliased into the oidc, code, passkey, and webauthn
# lists, with `session` last. Alias it into any other method you enable, such
# as saml, the same way.

selfservice:
  flows:
    registration:
      after:
        password:
          hooks: &registration_after_hooks
            - hook: web_hook
              config:
                url: https://your-deployed-handler.example.com/stripe/registration
                method: POST
                body: base64://<base64-encoded-jsonnet/registration.jsonnet>
                response:
                  ignore: true
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: <your-shared-secret>
                    in: header
            - hook: session
        oidc:
          hooks: *registration_after_hooks
        code:
          hooks: *registration_after_hooks
        passkey:
          hooks: *registration_after_hooks
        webauthn:
          hooks: *registration_after_hooks
