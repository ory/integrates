# Ory Actions configuration for Clearbit user enrichment.
# Async post-registration hook — enriches identity metadata in the background.

selfservice:
  flows:
    registration:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-webhook-handler.example.com/webhooks/clearbit/registration
              method: POST
              body: file:///config/jsonnet/registration.jsonnet
              response:
                ignore: true
              can_interrupt: false
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: YOUR_WEBHOOK_SECRET
                  in: header
