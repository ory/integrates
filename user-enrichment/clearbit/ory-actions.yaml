# Clearbit async post-registration enrichment.
#
# DEPRECATED: Clearbit's standalone API is no longer sold to new customers
# after the HubSpot acquisition. Use this only if you have a legacy contract.
#
# The hook sets response.ignore: true and runs after the identity is saved, so
# registration never waits for Clearbit and the handler receives the real
# identity ID. The handler writes the enrichment to metadata_admin through the
# Ory Admin API.
#
# Ory Network doesn't accept file:// bodies. Encode the template with
# `base64 < jsonnet/registration.jsonnet | tr -d '\n'` and paste it after base64://.

selfservice:
  flows:
    registration:
      after:
        password:
          hooks: &registration_after_hooks
            - hook: web_hook
              config:
                url: https://your-deployed-handler.example.com/clearbit/registration
                method: POST
                body: base64://<base64-encoded jsonnet/registration.jsonnet>
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: <your-shared-secret>
                    in: header
                response:
                  ignore: true
            - hook: session
        oidc:
          hooks: *registration_after_hooks
        code:
          hooks: *registration_after_hooks
        passkey:
          hooks: *registration_after_hooks
        webauthn:
          hooks: *registration_after_hooks
        # The password list is aliased into the oidc, code, passkey, and webauthn
        # lists. Alias it into any other method you enable, such as saml.
