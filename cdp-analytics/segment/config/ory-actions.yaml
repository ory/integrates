# Ory Actions configuration for Segment integration.
#
# All hooks are ASYNCHRONOUS (response.ignore: true) — fire-and-forget.
# They do not block or modify the identity flow.

selfservice:
  flows:
    registration:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-webhook-handler.example.com/webhooks/segment/registration
              method: POST
              body: file:///config/jsonnet/registration.jsonnet
              response:
                ignore: true
              can_interrupt: false
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: YOUR_WEBHOOK_SECRET
                  in: header
    login:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-webhook-handler.example.com/webhooks/segment/login
              method: POST
              body: file:///config/jsonnet/login.jsonnet
              response:
                ignore: true
              can_interrupt: false
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: YOUR_WEBHOOK_SECRET
                  in: header
    settings:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-webhook-handler.example.com/webhooks/segment/settings
              method: POST
              body: file:///config/jsonnet/registration.jsonnet
              response:
                ignore: true
              can_interrupt: false
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: YOUR_WEBHOOK_SECRET
                  in: header
