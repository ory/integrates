# Segment CDP forwarding hooks.
#
# All three hooks are fire-and-forget (response.ignore: true, can_interrupt:
# false). The handler returns 200 to Ory immediately and talks to Segment's
# HTTP Tracking API in the background. Segment availability never blocks
# user flows.

selfservice:
  flows:
    registration:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-deployed-handler.example.com/segment/registration
              method: POST
              body: file://./jsonnet/event.jsonnet
              can_interrupt: false
              response:
                ignore: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: <your-shared-secret>
                  in: header
    login:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-deployed-handler.example.com/segment/login
              method: POST
              body: file://./jsonnet/event.jsonnet
              can_interrupt: false
              response:
                ignore: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: <your-shared-secret>
                  in: header
    settings:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-deployed-handler.example.com/segment/settings
              method: POST
              body: file://./jsonnet/event.jsonnet
              can_interrupt: false
              response:
                ignore: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: <your-shared-secret>
                  in: header
