# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: bamboohr
displayName: BambooHR
vendor: BambooHR
category: directory-sync
type: webhook
maintainedBy: Community contributors
description: >-
  BambooHR is an HRIS popular with SMB and mid-market companies. This integration checks employment status in
  BambooHR from an Ory Action webhook on login or registration and blocks the flow for users who aren't active
  employees.
useCase: >-
  A company runs internal SaaS for employees and wants login to gate on employment status — off-boarded employees lose
  access automatically without a separate deprovision step. BambooHR is the HRIS source of truth; the integration looks
  up the user's BambooHR record at login and blocks the sign-in when there is no active record.
coreFunctionality: |-
  - Sync Ory Action webhook (response.parse: true) in the login method hook lists (for example selfservice.flows.login.after.password.hooks) and optionally registration.
  - Looks up the employee via /employees/directory filtered by workEmail (BambooHR has no direct lookup-by-email API), then fetches the employee's status.
  - Active employees get 204 No Content; no match or a non-Active status gets 403 with a Kratos `messages` body, which blocks the flow and shows the reason.
  - BambooHR errors return 502, which fails the flow, so every sign-in depends on BambooHR availability.
  - BambooHR Basic auth: API key as username, literal "x" as password — documented in code so it doesn't look like a typo.
oryMechanism:
  - actions
protocol:
  - rest-api
status: active
