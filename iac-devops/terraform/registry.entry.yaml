# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: terraform
displayName: Terraform Provider
vendor: Ory
category: iac-devops
type: config
maintainedBy: Ory Engineering
description: >-
  Officially maintained Terraform provider for managing Ory Network resources as infrastructure-as-code —
  identity schemas, OAuth2 clients, project configuration, identities, organizations, permissions, and
  actions (webhooks). Source at github.com/ory/terraform-provider-ory; published on the Terraform Registry as `ory/ory`
  and on the OpenTofu registry (search.opentofu.org/provider/ory/ory) under the same source — works with `tofu`
  as well as `terraform`. Targets Ory Network only — does not manage self-hosted Ory deployments.
useCase: >-
  A platform team running Ory Network wants their identity and OAuth2 configuration in Git (not the Console)
  for code review, drift detection, and per-environment (dev/staging/prod) reproducibility.
coreFunctionality: |-
  - Registry source: ory/ory (version ~> 26.3). Authentication via the workspace_api_key / project_api_key provider arguments or ORY_WORKSPACE_API_KEY / ORY_PROJECT_API_KEY env vars; project via project_id / project_slug or ORY_PROJECT_ID / ORY_PROJECT_SLUG.
  - Resources cover identity schemas (ory_identity_schema), OAuth2 clients (ory_oauth2_client), project config (ory_project_config), identities, organizations, permissions, and actions/webhooks (ory_action).
  - Many ory_project_config attributes were renamed to match OpenAPI spec; old names still work but emit deprecation warnings. The provider repo ships a migrate-deprecated-attrs.sh script for bulk rewrites.
  - Two API key types: Workspace keys (ory_wak_) manage projects, project configuration, identity schemas, actions, social/SAML providers, SCIM clients, and email templates; Project keys (ory_pat_) manage identities, OAuth2 clients, and relationships.
  - Existing resources can be adopted with `terraform import` using each resource's import ID format (after-hook ory_action: project_id:flow:after:auth_method:method:url; before-hooks omit auth_method); identity schemas can't be imported.
  - Provider is for Ory Network only — does NOT manage self-hosted Kratos/Hydra/Keto/Oathkeeper.
oryMechanism:
  - standards
protocol:
  - rest-api
status: active
