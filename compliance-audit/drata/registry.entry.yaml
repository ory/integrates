# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: drata
displayName: Drata
vendor: Drata
category: compliance-audit
type: config
maintainedBy: Community contributors
description: >-
  Pull identity and access management evidence from Ory Network into Drata for automated compliance monitoring
  (SOC 2, ISO 27001, HIPAA, PCI DSS, GDPR). No dedicated Ory docs or first-party Drata connector exists;
  integration via Drata's Generic Custom Connector polling the Ory admin API on a schedule.
useCase: >-
  An Ory Network customer pursuing or maintaining SOC 2 / ISO 27001 / similar compliance wants Drata to
  auto-collect IAM evidence from Ory rather than running manual evidence-gathering each audit cycle.
coreFunctionality: |-
  - Drata Generic Custom Connector polls the Ory admin API on a schedule using a Project-scoped API key with read access.
  - Common evidence pulls: GET /admin/identities (user list + lifecycle timestamps + MFA enrollment), GET /admin/identities/{id} (per-user roles / credentials / recovery), GET /admin/clients (OAuth2 clients as service accounts), Ory project config (password policy, session lifespan, MFA requirements).
  - JML controls map to identity create / update / deactivate timestamps.
  - Privileged access: OAuth2 clients with admin scopes can be flagged.
  - MFA enforcement: flag identities without TOTP/WebAuthn credentials where policy requires it.
  - Status: community/proposed — no dedicated ory/docs page; implementation lives in Drata's custom-connector layer.
oryMechanism:
  - standards
protocol:
  - rest-api
status: active
