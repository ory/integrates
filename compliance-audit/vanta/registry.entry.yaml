# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: vanta
displayName: Vanta
vendor: Vanta
category: compliance-audit
type: config
maintainedBy: Community contributors
description: >-
  Pull identity and access management evidence from Ory Network into Vanta for automated compliance monitoring
  (SOC 2, ISO 27001, HIPAA, etc.). No first-party Vanta connector exists; documented at ory.com/docs/integrates-with/compliance-audit/vanta; integration
  via Vanta's Custom Integration / API integration polling the Ory admin API on a schedule.
useCase: >-
  An Ory Network customer pursuing or maintaining SOC 2 / ISO 27001 / similar compliance wants Vanta to
  auto-collect IAM evidence from Ory rather than running manual evidence-gathering each audit cycle.
coreFunctionality: |-
  - Vanta Custom Integration polls the Ory admin API on a schedule with a project API key (full admin access; Ory Network has no read-only key) and reads the project configuration with a workspace API key.
  - Common evidence pulls: GET /admin/identities (user list + lifecycle + MFA enrollment), GET /admin/identities/{id} (roles / credentials / recovery), GET /admin/clients (OAuth2 clients as service accounts), GET https://api.console.ory.com/projects/<project-id> (password policy, session lifespan, MFA).
  - Access reviews: dormant-account detection via the identity list and each identity's sessions.
  - Termination controls: state: inactive and state_changed_at close the loop on offboarding evidence.
  - MFA enforcement: check credentials.webauthn.config.credentials with include_credential=webauthn, or the presence of a totp credential; credential types alone don't prove enrollment.
  - Password policy: validate against Ory project config minimum-complexity rules.
  - Status: community/proposed — documented at ory.com/docs/integrates-with/compliance-audit/vanta; implementation lives in Vanta's custom-integration layer.
oryMechanism:
  - standards
protocol:
  - rest-api
status: active
