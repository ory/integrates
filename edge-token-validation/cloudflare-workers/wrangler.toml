# Cloudflare Workers configuration for Ory edge token validation
#
# This Worker validates Ory session cookies or JWT tokens at the Cloudflare edge
# BEFORE traffic reaches your origin server, reducing latency and offloading auth.

name = "ory-edge-auth"
main = "src/worker.ts"
compatibility_date = "2024-01-01"

[vars]
ORY_SDK_URL = "https://YOUR_PROJECT_SLUG.projects.oryapis.com"
# Required for JWT validation. Requests with a JWT are rejected when unset.
JWT_AUDIENCE = "https://api.example.com"
# Defaults to ORY_SDK_URL. Set it when your project uses a custom domain as issuer.
# JWT_ISSUER = "https://auth.example.com"
PUBLIC_PATHS = "/health,/public,/favicon.ico"
# LOGIN_REDIRECT_URL = "https://your-app.com/login"

# For production, use different environments:
# [env.production]
# vars = { ORY_SDK_URL = "https://prod-project.projects.oryapis.com", JWT_AUDIENCE = "https://api.example.com", PUBLIC_PATHS = "/health,/public" }
# [env.staging]
# vars = { ORY_SDK_URL = "https://staging-project.projects.oryapis.com", JWT_AUDIENCE = "https://api.staging.example.com", PUBLIC_PATHS = "/health,/public,/debug" }
