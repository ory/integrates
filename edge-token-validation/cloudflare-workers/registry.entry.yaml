# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.
#
# RECLASSIFIED: this integration is NOT an Ory Action webhook. It's a
# Cloudflare Worker that validates Ory sessions / JWTs at the edge before
# requests reach origin. Code lives in src/worker.ts; deployed via Wrangler.

name: cloudflare-workers
displayName: Cloudflare Workers
vendor: Cloudflare
category: edge-token-validation
type: session-validation
maintainedBy: Community contributors
description: >-
  A Cloudflare Worker that validates Ory Network session cookies (via /sessions/whoami) or JWT Bearer tokens (locally
  against Ory's JWKS) at the Cloudflare edge before requests reach origin. Successful requests are forwarded with
  identity headers (X-User-Id, X-User-Email, X-Auth-AAL, ...) attached; unauthenticated requests are rejected at the
  edge with zero load on the backend.
useCase: >-
  A high-traffic product wants identity enforcement to happen at the CDN tier rather than at every backend service.
  The Worker validates each request before it reaches origin, reducing latency and offloading auth from the backend,
  and adds identity headers so downstream services can attribute the request without re-validating.
coreFunctionality: |-
  - Cloudflare Worker deployed via wrangler — runs in V8 isolates at the Cloudflare edge.
  - JWT Bearer tokens: RS256 only, key selected by kid with JWKS refresh on unknown kid, and iss, aud (JWT_AUDIENCE), exp, and nbf enforced. Requires JWT access tokens enabled on the Ory project.
  - Sessions: ory_session_* or ory_kratos_session cookies and ory_st_ session tokens are checked with Ory /sessions/whoami; active sessions are cached per credential hash for 30 s in bounded isolate memory.
  - Removes client-supplied identity headers, then forwards authenticated requests to origin with X-User-Id, X-Session-Id, X-User-Email, X-User-Name, X-Auth-AAL, X-User-Metadata headers.
  - Configurable PUBLIC_PATHS (exact path or prefix followed by /) to skip auth on health, public, and static paths.
  - Optional LOGIN_REDIRECT_URL redirects browser requests to login with return_to.
oryMechanism:
  - session-validation
protocol:
  - jwt
  - rest-api
status: active
