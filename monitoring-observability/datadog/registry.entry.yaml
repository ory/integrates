# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: datadog
displayName: Datadog
vendor: Datadog
category: monitoring-observability
type: config
maintainedBy: Ory Engineering
description: >-
  Monitor self-hosted Ory in Datadog over OpenTelemetry. Ory's tracer emits OTLP, which Datadog ingests either
  via the Datadog Agent's OTLP receiver or via Datadog's agentless OTLP intake. Self-hosted only: Ory Network
  does not export telemetry to customer-owned collectors.
useCase: >-
  An Ory customer running on Datadog wants identity-flow traces and metrics in the same pane of glass as the
  rest of their app — to debug latency in login/registration/MFA, alert on auth-error rates, and correlate
  identity events with downstream service calls.
coreFunctionality: |-
  - There is no `datadog` tracing provider: TRACING_PROVIDER accepts otel, jaeger, or zipkin. Reach Datadog with TRACING_PROVIDER=otel over OTLP.
  - Ory's span helper sets Datadog-convention error attributes (error.message, error.stack, error.type), so OTLP traces render correctly in Datadog APM.
  - Ory's exporter is OTLP over HTTP only. Ingest either via the Datadog Agent's OTLP HTTP receiver (port 4318) or directly to Datadog's OTLP intake on port 443 (dd-api-key header via OTEL_EXPORTER_OTLP_HEADERS, region-specific hosts). Configure with TRACING_PROVIDERS_OTLP_SERVER_URL (host:port, no scheme).
  - Prometheus metrics on /metrics/prometheus (each Ory service, admin port); ingest via the Datadog Agent's OpenMetrics check.
  - Ory Network: not available — managed project config excludes operational settings (tracing, logging, port).
oryMechanism:
  - standards
protocol:
  - otlp
  - rest-api
status: active
