# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: prometheus-grafana
displayName: Prometheus + Grafana
vendor: Prometheus / Grafana
category: monitoring-observability
type: config
maintainedBy: Ory Engineering
description: >-
  Every Ory service exposes a Prometheus-compatible metrics endpoint at /metrics/prometheus. Documented in the
  Ory self-hosted observability docs as the recommended metrics path; Grafana dashboards are not officially
  published — build your own around Ory's HTTP request metrics plus standard Go runtime metrics.
useCase: >-
  An Ory customer running Prometheus + Grafana wants identity service metrics in the same dashboards as the
  rest of their stack — request rate / latency / error rate per Ory endpoint, plus runtime health (Go GC,
  memory, goroutines).
coreFunctionality: |-
  - Each Ory service exposes /metrics/prometheus; ports differ per product (Kratos admin 4434, Hydra admin 4445, Keto 4468, Oathkeeper 9000).
  - Ory Network: scrape https://<project>.projects.oryapis.com/metrics/prometheus.
  - No officially published Grafana dashboard JSON; build around Ory HTTP request metrics + standard Go runtime metrics.
  - For richer signals (traces, distributed correlation), pair with monitoring-observability/opentelemetry feeding into Tempo/Jaeger.
oryMechanism:
  - standards
protocol:
  - rest-api
status: active
