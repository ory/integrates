# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: microsoft-sentinel
displayName: Microsoft Sentinel
vendor: Microsoft
category: siem-security-analytics
type: webhook
maintainedBy: Community contributors
description: >-
  Ingest Ory Network identity events into Microsoft Sentinel (cloud SIEM + SOAR on Azure) via the Azure Log
  Analytics Data Collector API (or the newer Logs Ingestion API for new deployments). Wired via Ory Actions
  on lifecycle hooks calling a customer-implemented handler that signs and posts events to Log Analytics.
useCase: >-
  A security team running Microsoft Sentinel wants Ory identity events in Sentinel for KQL hunts, analytics
  rules, and Logic Apps playbook automation — correlating identity events with the rest of the Azure security
  surface.
coreFunctionality: |-
  - Pattern: Ory Action async on lifecycle hooks → handler verifies shared secret → handler signs request with Azure HMAC-SHA256 scheme using Log Analytics workspace Primary Key → POST to https://<workspace-id>.ods.opinsights.azure.com/api/logs?api-version=2016-04-01 under custom log type OryEvents_CL.
  - Sentinel auto-creates the OryEvents_CL table on first ingest; the _CL suffix is added automatically by Log Analytics.
  - KQL analytics rules in Sentinel query OryEvents_CL for detection logic; Logic Apps playbooks automate response.
  - Data Collector API is being deprecated in favor of the Logs Ingestion API + DCRs (Data Collection Rules) — new deployments should target the newer API; watch the deprecation timeline.
  - Alternative: use Logic Apps as the intermediary — single Logic App receives the Ory Action webhook and posts to Sentinel, removing the need for custom handler code.
  - Status: community/proposed — no dedicated ory/docs page, no first-party handler.
oryMechanism:
  - actions
protocol:
  - rest-api
status: active
