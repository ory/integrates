# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: microsoft-sentinel
displayName: Microsoft Sentinel
vendor: Microsoft
category: siem-security-analytics
type: webhook
maintainedBy: Community contributors
description: >-
  Ingest Ory Network identity events into Microsoft Sentinel (cloud SIEM + SOAR on Azure) through the Logs
  Ingestion API and a data collection rule (DCR). Wired via Ory Actions on lifecycle hooks calling a
  customer-implemented handler that gets a Microsoft Entra token and posts events to the DCR stream.
useCase: >-
  A security team running Microsoft Sentinel wants Ory identity events in Sentinel for KQL hunts, analytics
  rules, and Logic Apps playbook automation — correlating identity events with the rest of the Azure security
  surface.
coreFunctionality: |-
  - Pattern: async Ory Action (response.ignore: true) in the method-specific hook lists → handler verifies shared secret → handler gets a Microsoft Entra token (client credentials) → POST to https://<dce-or-dcr-ingestion-endpoint>/dataCollectionRules/<dcr-immutable-id>/streams/<stream-name>?api-version=2023-01-01.
  - The DCR routes events into a custom table such as OryEvents_CL.
  - KQL analytics rules in Sentinel query OryEvents_CL for detection logic; Logic Apps playbooks automate response.
  - Microsoft ended support for the HTTP Data Collector API on September 14, 2026; use the Logs Ingestion API.
  - Alternative: use Logic Apps as the intermediary — single Logic App receives the Ory Action webhook and posts to Sentinel, removing the need for custom handler code.
  - Status: community/proposed — documented at ory.com/docs/integrates-with/siem-security-analytics/microsoft-sentinel, no first-party handler.
oryMechanism:
  - actions
protocol:
  - rest-api
status: active
