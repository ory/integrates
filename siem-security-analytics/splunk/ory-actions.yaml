# Splunk SIEM forwarding hooks.
#
# All four hooks are fire-and-forget (response.ignore: true, can_interrupt:
# false). The handler returns 200 to Ory immediately and posts the event to
# Splunk HEC in the background; Splunk availability never blocks user flows.

selfservice:
  flows:
    registration:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-deployed-handler.example.com/splunk/registration
              method: POST
              body: file://./jsonnet/event.jsonnet
              can_interrupt: false
              response:
                ignore: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: <your-shared-secret>
                  in: header
    login:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-deployed-handler.example.com/splunk/login
              method: POST
              body: file://./jsonnet/event.jsonnet
              can_interrupt: false
              response:
                ignore: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: <your-shared-secret>
                  in: header
    recovery:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-deployed-handler.example.com/splunk/recovery
              method: POST
              body: file://./jsonnet/event.jsonnet
              can_interrupt: false
              response:
                ignore: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: <your-shared-secret>
                  in: header
    settings:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-deployed-handler.example.com/splunk/settings
              method: POST
              body: file://./jsonnet/event.jsonnet
              can_interrupt: false
              response:
                ignore: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: <your-shared-secret>
                  in: header
