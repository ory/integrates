# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: eidas
displayName: eIDAS
vendor: European Commission (eIDAS regulation)
category: government-identity
type: config
maintainedBy: Community contributors
description: >-
  eIDAS — the EU regulation enabling cross-border use of national electronic IDs (German Personalausweis,
  Italian SPID, Belgian eID, French FranceConnect, Spanish DNI, etc.). Direct eIDAS node access requires
  government approval; integration goes through a commercial broker (Signicat, Criipto, IDnow, yes.com)
  that exposes eIDAS as standard OIDC and is consumable by Kratos's generic OIDC provider.
useCase: >-
  An EU-targeted product needs cross-border identity verification — a French citizen authenticating to a
  German service, etc. — using their national eID rather than re-running document verification per country.
coreFunctionality: |-
  - Configured as a generic OIDC provider in Kratos pointing at the broker's issuer; broker handles per-country eIDAS node integration.
  - Common brokers: Signicat (pan-EU), Criipto (Nordic + EU), IDnow, yes.com (DE).
  - eIDAS Levels of Assurance: Low / Substantial / High — broker reports LoA in the ID token; Jsonnet maps to identity metadata for downstream policy. Substantial roughly maps to Ory aal1; High to aal2.
  - Per-country eID schemes vary in user experience (card reader for DE Personalausweis, mobile app for FR FranceConnect, etc.) — the broker abstracts this.
  - Status: community/proposed — documented at ory.com/docs/integrates-with/government-identity/eidas; configures via the generic OIDC path once a broker is chosen.
oryMechanism:
  - standards
protocol:
  - oidc
status: active
