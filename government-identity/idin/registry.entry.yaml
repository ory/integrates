# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: idin
displayName: iDIN
vendor: Currence iDIN (Dutch banks)
category: government-identity
type: config
maintainedBy: Community contributors
description: >-
  iDIN is the Dutch banks' identity-verification service — users identify themselves online with their existing
  online-banking credentials (ING, Rabobank, ABN AMRO, etc.) and the bank returns verified attributes (name,
  address, date of birth, 18+ flag). Widely used in the Netherlands for KYC, age verification, and onboarding.
  Integration goes through a licensed broker (Signicat, CM.com, Connective) exposing iDIN as standard OIDC.
useCase: >-
  A Dutch-market product needs identity verification at signup or for age-gating without running its own
  document-verification flow — leaning on the KYC the user's bank already completed.
coreFunctionality: |-
  - Configured as a generic OIDC provider in Kratos pointing at a broker (Signicat, CM.com, Connective).
  - Bank-KYC verified attributes — high confidence by construction.
  - Common scopes: openid, profile, plus broker-specific iDIN scopes for name / address / DOB / `is18OrOlder` flag.
  - dateOfBirth is sensitive PII — prefer metadata_admin storage; if only age check is needed, request the is18OrOlder flag instead.
  - BSN (Dutch citizen service number) is NOT returned by default — requires Dutch government approval for the BSN scope.
  - Suitable for PSD2 SCA where the bank login itself acts as the strong-customer-authentication factor.
  - Status: community/proposed — no dedicated ory/docs page; configures via the generic OIDC path once a broker is chosen.
oryMechanism:
  - standards
protocol:
  - oidc
status: active
