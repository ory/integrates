# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: arkose-labs
displayName: Arkose Labs
vendor: Arkose Labs
category: fraud-bot-protection
type: webhook
maintainedBy: Community contributors
description: >-
  Bot and fraud prevention via Arkose Labs's adaptive enforcement challenges (invisible scoring escalating to
  interactive puzzles on risk). Wired into Ory via an Ory Action on registration.before / login.before with
  can_interrupt, verifying the Arkose token from the client SDK. No dedicated Ory docs page.
useCase: >-
  A high-value B2C product (financial, gaming, marketplace) needs strong bot defense at signup and login —
  more friction-sensitive than reCAPTCHA but more capable against sophisticated automation.
coreFunctionality: |-
  - Pattern: client SDK collects token → form submits token to Ory → Ory Action calls handler with can_interrupt → handler verifies via Arkose /api/v4/verify/ → handler returns success/failure → Ory consumes via response.parse.
  - Two Arkose keys: Public Key (client SDK) and Private Key (server verify); never expose Private.
  - Arkose tokens are one-time-use — handler must not retry verify with the same token.
  - Use a per-flow token (don't reuse across registration and login).
  - Adaptive challenges escalate per-risk; pick challenge type per-flow risk profile via Arkose's game configuration.
  - Status: community/proposed — no dedicated ory/docs page.
oryMechanism:
  - actions
status: active
