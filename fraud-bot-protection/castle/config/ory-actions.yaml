# Ory Actions configuration for Castle.io risk scoring.
#
# Post-login SYNCHRONOUS hook (response.parse: true, can_interrupt: true)
# so Castle can block high-risk logins or flag for MFA step-up.
#
# The client-side Castle.js SDK should pass the request token
# via transient_payload.castle_request_token.

selfservice:
  flows:
    login:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-webhook-handler.example.com/webhooks/castle/login
              method: POST
              body: file:///config/jsonnet/login.jsonnet
              response:
                parse: true
                ignore: false
              can_interrupt: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: YOUR_WEBHOOK_SECRET
                  in: header
    registration:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-webhook-handler.example.com/webhooks/castle/registration
              method: POST
              body: file:///config/jsonnet/login.jsonnet
              response:
                parse: true
                ignore: false
              can_interrupt: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: YOUR_WEBHOOK_SECRET
                  in: header
