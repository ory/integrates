# Castle.io risk assessment hooks.
#
# The login action runs synchronously (response.parse: true) so the handler
# can block the sign-in or require a second factor. The registration action
# runs after the identity is saved (no response.parse) so Castle receives the
# real identity ID; it reports the event and can't block the registration.
#
# The password lists are aliased into the oidc, code, passkey, and webauthn
# lists, so every sign-in method runs the same hooks. Alias them into any
# other method you enable, such as saml, the same way. The client-side Castle
# SDK passes the request token via transient_payload.castle_request_token.

selfservice:
  flows:
    login:
      after:
        password:
          hooks: &login_after_hooks
            - hook: web_hook
              config:
                url: https://your-deployed-handler.example.com/castle/login
                method: POST
                body: file://./jsonnet/login.jsonnet
                response:
                  parse: true
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: <your-shared-secret>
                    in: header
        oidc:
          hooks: *login_after_hooks
        code:
          hooks: *login_after_hooks
        passkey:
          hooks: *login_after_hooks
        webauthn:
          hooks: *login_after_hooks
    registration:
      after:
        password:
          hooks: &registration_after_hooks
            - hook: web_hook
              config:
                url: https://your-deployed-handler.example.com/castle/registration
                method: POST
                body: file://./jsonnet/registration.jsonnet
                response:
                  ignore: true
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: <your-shared-secret>
                    in: header
            - hook: session
        oidc:
          hooks: *registration_after_hooks
        code:
          hooks: *registration_after_hooks
        passkey:
          hooks: *registration_after_hooks
        webauthn:
          hooks: *registration_after_hooks
