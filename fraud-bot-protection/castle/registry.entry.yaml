# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: castle
displayName: Castle.io
vendor: Castle
category: fraud-bot-protection
type: webhook
maintainedBy: Community contributors
description: >-
  Castle.io is an adaptive risk-scoring platform for authentication flows. It evaluates device fingerprints, IP
  reputation, and behavioral signals to produce a real-time risk score and a recommended action (allow, challenge, or
  deny) for each login or registration event.
useCase: >-
  A B2C product wants to keep credential-stuffing and account-takeover attempts out of its login flow without blocking
  legitimate users behind a CAPTCHA. Castle scores each login in real time; the integration applies an allow / challenge
  / deny decision before the session is issued, and requires a second factor for challenge events.
coreFunctionality: |-
  - Receives a sync login action (response.parse: true) and a registration action that runs after the identity is saved.
  - Forwards the identity ID, client IP (True-Client-Ip), request headers, and Castle request token to Castle's Risk API.
  - At login: 403 with a messages body to block, 200 with required_aal aal2 to require a second factor (webhook_response_directives feature flag), 200 to allow.
  - At registration: reports the event; on deny, optionally deactivates the identity through the Ory Admin API.
  - Fails open on Castle outages so authentication never breaks because of Castle availability.
oryMechanism:
  - actions
protocol:
  - rest-api
status: active
