# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: hcaptcha
displayName: hCaptcha
vendor: hCaptcha
category: fraud-bot-protection
type: webhook
maintainedBy: Community contributors
description: >-
  Privacy-focused CAPTCHA via hCaptcha — drop-in alternative to reCAPTCHA with stronger privacy posture
  (GDPR-compliant, no data sale) and a paid Enterprise tier with adaptive challenge difficulty. Wired into
  Ory via an Ory Action on registration.before / login.before with can_interrupt, verifying the hCaptcha
  token from the client widget.
useCase: >-
  A consumer product wants CAPTCHA defense at signup/login without Google's reCAPTCHA privacy concerns —
  hCaptcha's GDPR posture and no-data-sale guarantee make it a common choice in EU-targeted products.
coreFunctionality: |-
  - Pattern: client widget collects token (h-captcha-response) → form submits → Ory Action with can_interrupt calls handler → handler verifies via POST https://hcaptcha.com/siteverify → handler returns success/failure → Ory consumes via response.parse.
  - Two keys: Site Key (public, client widget) and Secret (server verify); never expose Secret.
  - Tokens are one-time-use and expire 2 minutes after issue.
  - hCaptcha API contract is nearly identical to reCAPTCHA — easy migration between the two.
  - Enterprise tier adds adaptive risk scoring and invisible challenges; verify endpoint shape unchanged.
  - Status: community/proposed — no dedicated ory/docs page; same pattern as Turnstile / reCAPTCHA / Arkose.
oryMechanism:
  - actions
protocol:
  - rest-api
status: active
