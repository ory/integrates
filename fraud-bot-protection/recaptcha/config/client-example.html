<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ory Registration with reCAPTCHA v3</title>
  <!--
    This example shows how to integrate Google reCAPTCHA v3 with
    Ory's custom UI registration flow.

    The reCAPTCHA token is passed to Ory via the transient_payload field,
    which the webhook handler then validates server-side.

    Replace YOUR_RECAPTCHA_SITE_KEY with your actual reCAPTCHA v3 site key.
  -->
  <script src="https://www.google.com/recaptcha/api.js?render=YOUR_RECAPTCHA_SITE_KEY"></script>
</head>
<body>
  <h1>Register</h1>
  <form id="registration-form">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>

    <label for="first-name">First Name:</label>
    <input type="text" id="first-name" name="first_name">

    <label for="last-name">Last Name:</label>
    <input type="text" id="last-name" name="last_name">

    <button type="submit">Register</button>
  </form>

  <div id="error-message" style="color: red; display: none;"></div>

  <script>
    // Get the flow ID from the URL (Ory redirects here with ?flow=...)
    const urlParams = new URLSearchParams(window.location.search);
    const flowId = urlParams.get('flow');

    document.getElementById('registration-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const errorDiv = document.getElementById('error-message');
      errorDiv.style.display = 'none';

      try {
        // 1. Get reCAPTCHA v3 token
        const recaptchaToken = await grecaptcha.execute('YOUR_RECAPTCHA_SITE_KEY', {
          action: 'register'
        });

        // 2. Submit to Ory's registration flow with the token in transient_payload
        const response = await fetch(`/self-service/registration?flow=${flowId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            method: 'password',
            password: document.getElementById('password').value,
            traits: {
              email: document.getElementById('email').value,
              name: {
                first: document.getElementById('first-name').value,
                last: document.getElementById('last-name').value,
              },
            },
            // This is where the reCAPTCHA token is passed to Ory.
            // The webhook handler extracts it from ctx.flow.transient_payload.recaptcha_token
            transient_payload: {
              recaptcha_token: recaptchaToken,
            },
          }),
        });

        if (response.ok) {
          window.location.href = '/dashboard';
        } else {
          const data = await response.json();
          // Display Ory's error messages (including CAPTCHA failures)
          const messages = data.ui?.messages || [];
          if (messages.length > 0) {
            errorDiv.textContent = messages.map(m => m.text).join(', ');
            errorDiv.style.display = 'block';
          }
        }
      } catch (err) {
        errorDiv.textContent = 'An error occurred. Please try again.';
        errorDiv.style.display = 'block';
        console.error(err);
      }
    });
  </script>
</body>
</html>
