# Ory Actions configuration for reCAPTCHA integration.
#
# This is a BEFORE hook with can_interrupt: true — it blocks the flow
# if CAPTCHA verification fails.
#
# The client-side app must pass the reCAPTCHA token in the transient_payload:
#   { "transient_payload": { "recaptcha_token": "03AGdBq26..." } }
#
# IMPORTANT: Replace YOUR_WEBHOOK_SECRET with a strong random secret.

selfservice:
  flows:
    registration:
      before:
        hooks:
          - hook: web_hook
            config:
              url: https://your-webhook-handler.example.com/webhooks/recaptcha/verify
              method: POST
              body: file:///config/jsonnet/verify.jsonnet
              response:
                parse: true
                ignore: false
              can_interrupt: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: YOUR_WEBHOOK_SECRET
                  in: header
    login:
      before:
        hooks:
          - hook: web_hook
            config:
              url: https://your-webhook-handler.example.com/webhooks/recaptcha/verify
              method: POST
              body: file:///config/jsonnet/verify.jsonnet
              response:
                parse: true
                ignore: false
              can_interrupt: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: YOUR_WEBHOOK_SECRET
                  in: header
