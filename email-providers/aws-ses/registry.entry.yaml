# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: aws-ses
displayName: Amazon SES
vendor: Amazon Web Services
category: email-providers
type: config
maintainedBy: Ory Engineering
description: >-
  Use Amazon SES as the SMTP courier for Ory Network transactional emails. SES is AWS's email service with
  high deliverability, pay-per-use pricing, and deep AWS integration; documented directly in the Ory SMTP
  courier page. Natural choice when the rest of the stack is on AWS.
useCase: >-
  An Ory Network customer running on AWS wants email delivery from the same cloud, billed and observed
  alongside the rest of their AWS infrastructure (CloudWatch metrics, SNS bounce/complaint notifications,
  IAM-based credential rotation).
coreFunctionality: |-
  - Configured via Kratos's SMTP courier per docs/kratos/emails-sms/sending-emails-smtp#aws-ses (no code).
  - Connection URI: smtps://<smtp_user>:<url-encoded smtp_pass>@email-smtp.<region>.amazonaws.com:465 (or :587 for STARTTLS).
  - SES SMTP credentials are generated in the SES console and wrap an IAM user — they are NOT the same as IAM access keys.
  - URL-encode "+", "/", "=" in the SMTP password (commonly appear) — %2B, %2F, %3D.
  - New SES accounts are sandboxed and only deliver to verified recipients; production access must be requested.
  - Easy DKIM (three CNAME records) is the standard deliverability setup; bounce/complaint notifications via SNS feed back into reputation.
oryMechanism:
  - courier-spi
status: active
