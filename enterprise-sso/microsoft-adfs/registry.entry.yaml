# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: microsoft-adfs
displayName: Microsoft AD FS
vendor: Microsoft
category: enterprise-sso
type: config
maintainedBy: Ory Engineering
description: >-
  Configure on-premises Microsoft Active Directory Federation Services (AD FS) as a SAML 2.0 Identity Provider
  into Ory Polis. Documented directly in the Ory Polis SSO providers docs. Common path for enterprises
  maintaining on-prem Active Directory who want SSO to cloud apps without migrating to Entra ID.
useCase: >-
  An enterprise with significant investment in on-prem Active Directory wants their AD-anchored workforce
  identities to authenticate to Ory-protected applications without migrating user management to a cloud IdP.
coreFunctionality: |-
  - Configured per Ory Polis docs at /polis/sso-providers/microsoft-adfs; Polis acts as the SAML SP, AD FS as the IdP.
  - AD FS side: Relying Party Trusts → Add Relying Party Trust → import Polis SP metadata XML.
  - Claim Issuance Policy: LDAP attribute mapping (E-Mail-Addresses → Email, Given-Name → Given Name, Surname → Surname); NameID format Email.
  - Token signing certificate auto-rollover (typically yearly) requires updating metadata in Polis — subscribe to AD FS event 102 or pull metadata on a schedule.
  - Group claims via Group SID or Token-Groups Unqualified Names attribute; map server-side in Ory.
  - WS-Federation NOT supported — Polis only consumes SAML 2.0.
oryMechanism:
  - standards
status: active
