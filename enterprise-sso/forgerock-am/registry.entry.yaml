# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: forgerock-am
displayName: ForgeRock Access Management
vendor: Ping Identity (ForgeRock)
category: enterprise-sso
type: config
maintainedBy: Community contributors
description: >-
  Configure ForgeRock Access Management (now part of Ping Identity following the 2023 acquisition) as an upstream
  SAML 2.0 or OIDC identity provider in Ory Polis. Documented at ory.com/docs/integrates-with/enterprise-sso/forgerock-am; configures via the Polis generic SAML or
  generic OIDC walkthrough.
useCase: >-
  An enterprise running ForgeRock AM (or the rebranded Ping Identity Platform) as their workforce IdP wants
  Ory-protected applications to consume ForgeRock-issued sessions instead of standing up a separate identity
  store.
coreFunctionality: |-
  - Configured as a generic SAML 2.0 SP (preferred for enterprise SSO) or generic OIDC RP in Ory Polis pointing at the ForgeRock entity / OAuth client.
  - ForgeRock side: SAML entity under Realms → Applications → Federation, or OAuth 2.0 client under OAuth 2.0 → Clients.
  - SP-initiated only — Polis does not consume IdP-initiated SAML assertions; configure the ForgeRock side accordingly.
  - OIDC supports openid / profile / email / groups; group claims may need a custom scope mapper depending on AM version.
  - Status: community/proposed — documented at ory.com/docs/integrates-with/enterprise-sso/forgerock-am.
oryMechanism:
  - standards
protocol:
  - saml2
  - oidc
status: active
