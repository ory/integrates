# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: okta
displayName: Okta
vendor: Okta
category: enterprise-sso
type: config
maintainedBy: Ory Engineering
description: >-
  Configure Okta as a SAML 2.0 (preferred for B2B SSO) or OIDC Identity Provider into Ory Polis. Documented
  directly in the Ory Polis SSO providers docs. Near-default option in most enterprise SSO conversations
  because Okta dominates cloud workforce identity.
useCase: >-
  A SaaS product with an Ory Network identity stack offers enterprise SSO and a customer's workforce identity
  is in Okta — this integration is the per-customer SAML or OIDC connection setup.
coreFunctionality: |-
  - Configured per Ory Polis docs at /polis/sso-providers/okta; Polis acts as the SAML SP / OIDC RP, Okta as the IdP.
  - Okta side: Applications → Create App Integration → SAML 2.0 (preferred) or OIDC Web Application.
  - SAML: Single sign-on URL = Polis ACS URL; Audience URI = Polis Entity ID; both from Ory's setup-link.
  - Attribute statements: email, firstName, lastName. Groups released only if explicitly mapped in attribute statements (SAML) or claims (OIDC).
  - Sign-on Policies (MFA, network zones, device trust) sit at the Okta layer; resulting authenticated assertion flows through to Ory.
  - For SCIM provisioning of Okta users into Ory, see directory-sync/okta-scim (separate concern).
oryMechanism:
  - standards
status: active
