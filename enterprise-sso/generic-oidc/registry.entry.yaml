# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: generic-oidc
displayName: Generic OIDC Provider
vendor: Ory
category: enterprise-sso
type: config
maintainedBy: Ory Engineering
description: >-
  Configure ANY OIDC-compliant Identity Provider into Ory Polis as the OIDC Relying Party. Canonical reference
  for OIDC-based enterprise SSO with Ory and the fallback when no provider-specific guide covers an IdP. Same
  source page is mirrored under generic-protocols/generic-oidc.
useCase: >-
  An Ory Polis customer needs to integrate an OIDC IdP that isn't on the supported-vendor list (open-source IdPs
  like Keycloak, Authentik, Zitadel, or any custom OIDC implementation), or wants the protocol mechanics
  documented for debugging or non-default configuration.
coreFunctionality: |-
  - Configured per the canonical Ory Polis page at /polis/sso-providers/generic-oidc; Polis acts as the OIDC RP, IdP as the OP.
  - Discovery via /.well-known/openid-configuration on the issuer URL — Polis fetches and caches automatically.
  - Required from the IdP: issuer URL, client id, client secret, plus the Polis ACS URL configured on the IdP side as the redirect URI.
  - Standard scopes: openid (required), profile, email; add groups if attribute mapping needs them.
  - Same content mirrored at generic-protocols/generic-oidc — categorization choice; either entry resolves to the same Polis page.
oryMechanism:
  - standards
status: active
