# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: duo-security
displayName: Duo Security
vendor: Cisco
category: mfa
type: webhook
maintainedBy: Community contributors
description: >-
  Duo Security (a Cisco company) is an enterprise MFA platform with push and passcode flows. This integration
  verifies a Duo passcode from an Ory Action webhook at sign-in and blocks the sign-in unless Duo allows it.
useCase: >-
  An enterprise has already standardized its workforce on Duo for MFA and wants to reuse that enrollment from
  Ory-hosted login flows without re-enrolling users in Ory's native TOTP/WebAuthn.
coreFunctionality: |-
  - Sync post-login Ory Action webhook in the method-specific login hook lists (response.parse: true).
  - Reads the Duo passcode from the flow's transient_payload and the client IP from True-Client-Ip.
  - Signs Duo Auth API requests with HMAC-SHA1 over a canonicalized request line per Duo's spec.
  - POSTs /auth/v2/auth with factor=passcode; Duo answers immediately with allow or deny.
  - Responds 200 on allow and 403 with Ory UI messages otherwise, so Duo errors never grant access and Ory never retries.
oryMechanism:
  - actions
protocol:
  - rest-api
status: active
