# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: okta-verify
displayName: Okta Verify
vendor: Okta
category: mfa
type: webhook
maintainedBy: Community contributors
description: >-
  Okta Verify is Okta's first-party MFA app supporting push notifications and one-time codes. This integration
  verifies an Okta Verify code from an Ory Action webhook at sign-in and blocks the sign-in unless Okta accepts it.
useCase: >-
  An enterprise has already standardized its workforce on Okta Verify and wants to reuse that enrollment from
  Ory-hosted login flows without re-enrolling users in Ory's native TOTP/WebAuthn.
coreFunctionality: |-
  - Sync post-login Ory Action webhook in the method-specific login hook lists (response.parse: true).
  - Reads the Okta user ID from metadata_public.okta_user_id and the code from the flow's transient_payload.
  - GET /api/v1/users/{userId}/factors → finds the active Okta Verify code factor (token:software:totp).
  - POST /api/v1/users/{userId}/factors/{factorId}/verify with passCode; Okta answers immediately.
  - Responds 200 on SUCCESS and 403 with Ory UI messages otherwise; unenrolled users are blocked unless OKTA_ALLOW_UNENROLLED=true.
oryMechanism:
  - actions
protocol:
  - rest-api
status: active
