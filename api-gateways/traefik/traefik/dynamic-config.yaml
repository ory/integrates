# Traefik dynamic configuration.
#
# Wires up Traefik's forwardAuth middleware to the Ory session validator
# in forwardauth/server.ts. Traefik replaces each header listed in
# authResponseHeaders with the validator's value, or removes it when the
# validator doesn't set it, so clients can't supply identity headers.
# Routes without ory-auth use strip-identity-headers instead.

http:
  middlewares:
    ory-auth:
      forwardAuth:
        address: http://ory-forwardauth:4181
        authResponseHeaders:
          - X-User-Id
          - X-User-Email
          - X-User-Name
          - X-Session-Id
          - X-Auth-AAL
          - X-User-Metadata

    strip-identity-headers:
      headers:
        customRequestHeaders:
          X-User-Id: ""
          X-User-Email: ""
          X-User-Name: ""
          X-Session-Id: ""
          X-Auth-AAL: ""
          X-User-Metadata: ""

  routers:
    api:
      rule: PathPrefix(`/api`)
      service: api-service
      middlewares:
        - ory-auth
      entryPoints:
        - websecure
      tls: {}

    public:
      rule: PathPrefix(`/public`) || Path(`/health`)
      service: api-service
      middlewares:
        - strip-identity-headers
      entryPoints:
        - websecure
      tls: {}

  services:
    api-service:
      loadBalancer:
        servers:
          - url: http://your-backend:8080
