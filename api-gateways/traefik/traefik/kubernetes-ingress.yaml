# Kubernetes IngressRoute for Traefik + Ory ForwardAuth.
#
# Assumes Traefik is installed as the cluster's ingress controller with CRDs
# enabled, and that ory-forwardauth (the service in ../forwardauth/) is
# deployed as a Service named ory-forwardauth in the default namespace.

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ory-auth
  namespace: default
spec:
  forwardAuth:
    address: http://ory-forwardauth.default.svc.cluster.local:4181
    trustForwardHeader: true
    authResponseHeaders:
      - X-User-Id
      - X-User-Email
      - X-User-Name
      - X-Session-Id
      - X-Auth-AAL
      - X-User-Metadata

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-protected
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: PathPrefix(`/api`)
      kind: Rule
      services:
        - name: backend-service
          port: 8080
      middlewares:
        - name: ory-auth
  tls:
    certResolver: letsencrypt

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-public
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: PathPrefix(`/public`) || Path(`/health`)
      kind: Rule
      services:
        - name: backend-service
          port: 8080
  tls:
    certResolver: letsencrypt
