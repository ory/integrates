# Docker Compose for Traefik + Ory ForwardAuth
#
# This runs Traefik with the Ory session validation middleware.
# Your backend service receives validated identity data via headers.

version: "3.8"

services:
  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
    ports:
      - "80:80"
      - "8080:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-dynamic.yaml:/etc/traefik/dynamic.yaml:ro

  ory-auth:
    build: .
    environment:
      # IMPORTANT: Set ORY_SDK_URL to your Ory Network project URL.
      # For Ory Network: https://<your-project>.projects.oryapis.com
      - ORY_SDK_URL=https://your-project.projects.oryapis.com
      - ALLOWED_PATHS=/health,/public
      # Optional: redirect unauthenticated users to your login page
      # - LOGIN_REDIRECT_URL=https://your-app.com/login
    expose:
      - "4181"

  # Example backend service — receives identity headers from Traefik
  backend:
    image: your-backend:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.middlewares=ory-auth@file"
    expose:
      - "8080"
