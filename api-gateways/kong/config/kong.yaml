# Kong declarative configuration for validating Ory-issued JWT access tokens.
#
# Kong's open source jwt plugin does not fetch JWKS. It verifies the RS256
# signature with the PEM public key stored on the Consumer's JWT credential
# and selects that credential by the token's `iss` claim. The post-function
# then requires the API audience on the same token the jwt plugin accepted.
#
# Before you load this file:
#   1. Switch the Ory project to JWT access tokens and issue tokens with an
#      audience (see the README).
#   2. Replace YOUR_ORY_PROJECT with your project slug and
#      https://api.example.com with your API's audience.
#   3. Paste the complete PEM of the JWKS key that signs your tokens under
#      rsa_public_key (see the README for a conversion command).
#   4. Allow the post-function to load the JWT parser in the Lua sandbox with
#      untrusted_lua_sandbox_requires = kong.plugins.jwt.jwt_parser
#      (KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES in docker-compose.yaml).

_format_version: "3.0"

consumers:
  - username: ory
    jwt_secrets:
      - algorithm: RS256
        key: https://YOUR_ORY_PROJECT.projects.oryapis.com
        secret: unused-for-rs256
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          REPLACE-WITH-THE-COMPLETE-PEM-FROM-THE-ORY-JWKS
          -----END PUBLIC KEY-----

services:
  - name: protected-api
    url: http://your-backend:8080
    routes:
      - name: api-route
        paths:
          - /api
        strip_path: false
    plugins:
      - name: jwt
        config:
          header_names:
            - Authorization
          uri_param_names: []
          cookie_names: []
          claims_to_verify:
            - exp
      - name: post-function
        config:
          access:
            - |
              local token = kong.ctx.shared.authenticated_jwt_token
              if type(token) ~= "string" then
                return kong.response.exit(401, { message = "Unauthorized" })
              end

              local jwt = require("kong.plugins.jwt.jwt_parser"):new(token)
              if not jwt then
                return kong.response.exit(401, { message = "Unauthorized" })
              end

              local nbf = jwt.claims.nbf
              if nbf ~= nil and (type(nbf) ~= "number" or nbf > ngx.time()) then
                return kong.response.exit(401, { message = "Unauthorized" })
              end

              local expected = "https://api.example.com"
              local audience = jwt.claims.aud
              local allowed = audience == expected
              if type(audience) == "table" then
                for _, value in ipairs(audience) do
                  if type(value) ~= "string" then
                    return kong.response.exit(403, { message = "Forbidden" })
                  end
                  if value == expected then
                    allowed = true
                  end
                end
              end

              if not allowed then
                return kong.response.exit(403, { message = "Forbidden" })
              end

              local sub = jwt.claims.sub
              if type(sub) ~= "string" then
                return kong.response.exit(403, { message = "Forbidden" })
              end
              kong.service.request.set_header("X-User-Id", sub)

  - name: public-api
    url: http://your-backend:8080
    routes:
      - name: public-route
        paths:
          - /public
          - /health
        strip_path: false
    plugins:
      - name: pre-function
        config:
          access:
            - kong.service.request.clear_header("X-User-Id")
