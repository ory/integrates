# Kong Enterprise — OpenID Connect plugin configuration for Ory JWT access tokens
#
# The OpenID Connect plugin (Enterprise only) discovers Ory's JWKS from the
# issuer and refreshes keys automatically, so it handles key rotation that the
# open source jwt plugin cannot. It validates bearer JWTs locally.
#
# Replace YOUR_ORY_PROJECT with your Ory Network project slug and
# https://api.example.com with your API's audience.

_format_version: "3.0"

services:
  - name: protected-api
    url: http://your-backend:8080
    routes:
      - name: api-route
        paths:
          - /api
    plugins:
      - name: openid-connect
        config:
          issuer: https://YOUR_ORY_PROJECT.projects.oryapis.com
          issuers_allowed:
            - https://YOUR_ORY_PROJECT.projects.oryapis.com
          auth_methods:
            - bearer
          bearer_token_param_type:
            - header
          audience_required:
            - https://api.example.com
          upstream_headers_claims:
            - sub
          upstream_headers_names:
            - X-User-Id
          cache_ttl: 3600
