# Docker Compose for Kong + Ory JWT validation
#
# This runs Kong in DB-less declarative mode with the JWT plugin
# configured to validate Ory-issued tokens.

services:
  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yaml
      KONG_UNTRUSTED_LUA: sandbox
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: kong.plugins.jwt.jwt_parser
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
    ports:
      - "8000:8000"  # Proxy
    volumes:
      - ./kong.yaml:/etc/kong/kong.yaml:ro
