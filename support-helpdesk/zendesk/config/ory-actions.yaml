# Ory Actions configuration for Zendesk user sync.
# Async hooks — fire-and-forget, don't block identity flows.

selfservice:
  flows:
    registration:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-webhook-handler.example.com/webhooks/zendesk/registration
              method: POST
              body: file:///config/jsonnet/event.jsonnet
              response:
                ignore: true
              can_interrupt: false
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: YOUR_WEBHOOK_SECRET
                  in: header
    settings:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-webhook-handler.example.com/webhooks/zendesk/settings
              method: POST
              body: file:///config/jsonnet/event.jsonnet
              response:
                ignore: true
              can_interrupt: false
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: YOUR_WEBHOOK_SECRET
                  in: header
