# Zendesk user-sync hooks.
#
# Both hooks are fire-and-forget (response.ignore: true, can_interrupt: false)
# so user flows are never blocked by Zendesk availability. The handler returns
# 200 to Ory immediately and upserts the Zendesk user in the background.

selfservice:
  flows:
    registration:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-deployed-handler.example.com/zendesk/registration
              method: POST
              body: file://./jsonnet/identity.jsonnet
              can_interrupt: false
              response:
                ignore: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: <your-shared-secret>
                  in: header
    settings:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-deployed-handler.example.com/zendesk/settings
              method: POST
              body: file://./jsonnet/identity.jsonnet
              can_interrupt: false
              response:
                ignore: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: <your-shared-secret>
                  in: header
