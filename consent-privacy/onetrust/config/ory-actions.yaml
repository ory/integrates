# Ory Actions configuration for OneTrust consent management.
# Sync hook on registration — stores consent preferences in identity metadata
# and records the consent receipt in OneTrust.
#
# The client must pass consent preferences via transient_payload:
#   { "transient_payload": { "consent": { "marketing": true, "analytics": false } } }

selfservice:
  flows:
    registration:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-webhook-handler.example.com/webhooks/onetrust/registration
              method: POST
              body: file:///config/jsonnet/registration.jsonnet
              response:
                parse: true
                ignore: false
              can_interrupt: false
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: YOUR_WEBHOOK_SECRET
                  in: header
