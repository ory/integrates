# OneTrust consent capture hooks.
#
# The first action (response.parse: true) runs before the identity is saved
# and returns metadata_public.consent, so Ory stores the choices on the new
# identity. The identity has no ID yet at that point. The second action
# (response.ignore: true) runs after the identity is saved and records the
# OneTrust consent receipt with the identity ID.
#
# Encode the body template with `base64 < jsonnet/registration.jsonnet | tr -d '\n'`.
# Ory Network doesn't accept file:// URLs.
#
# The password list is aliased into the oidc, code, passkey, and webauthn
# lists, so every sign-up method runs both actions with `session` last. Alias
# it into any other method you enable, such as saml, the same way.

selfservice:
  flows:
    registration:
      after:
        password:
          hooks: &registration_after_hooks
            - hook: web_hook
              config:
                url: https://your-deployed-handler.example.com/onetrust/registration
                method: POST
                body: base64://<base64-encoded-jsonnet/registration.jsonnet>
                response:
                  parse: true
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: <your-shared-secret>
                    in: header
            - hook: web_hook
              config:
                url: https://your-deployed-handler.example.com/onetrust/receipt
                method: POST
                body: base64://<base64-encoded-jsonnet/registration.jsonnet>
                response:
                  ignore: true
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: <your-shared-secret>
                    in: header
            - hook: session
        oidc:
          hooks: *registration_after_hooks
        code:
          hooks: *registration_after_hooks
        passkey:
          hooks: *registration_after_hooks
        webauthn:
          hooks: *registration_after_hooks
