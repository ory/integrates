# Pipedrive person sync and login-activity hooks.
#
# All hooks set response.ignore: true, so Ory sends them in the background and
# Pipedrive availability never blocks user flows.
#
# Ory Network doesn't accept file:// bodies. Encode each template with
# `base64 < jsonnet/<template> | tr -d '\n'` and paste it after base64://.

selfservice:
  flows:
    registration:
      after:
        password:
          hooks: &registration_after_hooks
            - hook: web_hook
              config:
                url: https://your-deployed-handler.example.com/pipedrive/sync-user
                method: POST
                body: base64://<base64-encoded jsonnet/sync-user.jsonnet>
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: <your-shared-secret>
                    in: header
                response:
                  ignore: true
            - hook: session
        oidc:
          hooks: *registration_after_hooks
        code:
          hooks: *registration_after_hooks
        passkey:
          hooks: *registration_after_hooks
        webauthn:
          hooks: *registration_after_hooks
        # The password list is aliased into the oidc, code, passkey, and webauthn
        # lists. Alias it into any other method you enable, such as saml.
    settings:
      after:
        profile:
          hooks:
            - hook: web_hook
              config:
                url: https://your-deployed-handler.example.com/pipedrive/sync-user
                method: POST
                body: base64://<base64-encoded jsonnet/sync-user.jsonnet>
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: <your-shared-secret>
                    in: header
                response:
                  ignore: true
    login:
      after:
        password:
          hooks: &login_after_hooks
            - hook: web_hook
              config:
                url: https://your-deployed-handler.example.com/pipedrive/track-login-activity
                method: POST
                body: base64://<base64-encoded jsonnet/track-login.jsonnet>
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: <your-shared-secret>
                    in: header
                response:
                  ignore: true
        oidc:
          hooks: *login_after_hooks
        code:
          hooks: *login_after_hooks
        passkey:
          hooks: *login_after_hooks
        webauthn:
          hooks: *login_after_hooks
        # The password list is aliased into the oidc, code, passkey, and webauthn
        # lists. Alias it into any other method you enable, such as saml.
