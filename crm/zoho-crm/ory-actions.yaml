# Zoho CRM Contact sync hook.

selfservice:
  flows:
    registration:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-deployed-handler.example.com/zoho-crm/sync-user
              method: POST
              body: file://./jsonnet/sync-user.jsonnet
              can_interrupt: false
              response:
                ignore: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: <your-shared-secret>
                  in: header
    settings:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-deployed-handler.example.com/zoho-crm/sync-user
              method: POST
              body: file://./jsonnet/sync-user.jsonnet
              can_interrupt: false
              response:
                ignore: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: <your-shared-secret>
                  in: header
