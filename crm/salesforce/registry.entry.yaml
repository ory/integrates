# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: salesforce
displayName: Salesforce (CRM)
vendor: Salesforce
category: crm
type: config
maintainedBy: Community contributors
description: >-
  Sync Ory identities to Salesforce as Leads or Contacts with Ory Actions webhooks and a handler you deploy, which
  calls the Salesforce REST API with OAuth2 service-to-service authentication. Distinct from social-sign-in/salesforce
  (the sign-in provider). No first-party webhook handler ships here — wiring is Ory Action config + Jsonnet body.
useCase: >-
  A B2B SaaS product running their sales pipeline on Salesforce wants newly registered users to land as Leads
  in Salesforce automatically — no separate sync job, no daily exports.
coreFunctionality: |-
  - Async Ory Action in the registration method lists (for example registration.after.password.hooks) and optionally settings.after.profile.hooks sends the identity to your handler; the handler posts to the Salesforce REST API: POST /services/data/vXX.0/sobjects/Lead/ or /Contact/.
  - Salesforce Connected App with OAuth2 Client Credentials Flow + `api` scope; integration-user Permission Set grants object-create permission.
  - The handler obtains and caches the Salesforce access token with the client credentials flow; Ory webhooks support only api_key and basic_auth, so Ory can't fetch the token itself.
  - Lead vs Contact: start with Lead; promote to Contact via Salesforce-side automation, not Ory.
  - Edition matters — Connected Apps + Permission Sets require Salesforce Enterprise edition or higher.
  - Daily API call limits vary by edition; high-volume signup flows may need batch creation rather than per-event calls.
  - Status: community/proposed — documented at ory.com/docs/integrates-with/crm/salesforce.
oryMechanism:
  - actions
protocol:
  - rest-api
  - oauth2
status: active
