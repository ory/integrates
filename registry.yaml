      (IAM-bound, not env vars); Route 53 CNAME to custom.oryapis.com for the custom auth domain.

      - Pattern B (self-hosted on EKS): EKS cluster with --with-oidc, RDS PostgreSQL Multi-AZ for Kratos/Hydra/Keto
