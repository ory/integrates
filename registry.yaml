      - Alternative: implement Steam OpenID 2.0 in your backend and create/lookup identities via the Kratos Admin API,
      bypassing the social-signin subsystem.

      - Steam does NOT share email; design the identity schema to use the 64-bit Steam ID as the credential identifier.

