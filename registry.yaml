      origin. Same shape as the canonical edge-token-validation/cloudflare-workers reference, adapted to EdgeWorkers'
      httpRequest API and EdgeKV caching. Documented at
      ory.com/docs/integrates-with/edge-token-validation/akamai-edgeworkers.
    useCase: >-
      A team running Akamai for CDN + edge security wants Ory session / JWT validation at the edge so origin receives a
      trusted X-User-Id (or 401 from the edge for invalid tokens) without round-tripping every request to origin.
    coreFunctionality: |-
      - EdgeWorker fires on onClientRequest; reads session cookie or Authorization: Bearer.
      - Hydra JWT: verify signature against cached Ory JWKS using EdgeWorkers Crypto API.
      - Kratos session: call https://<project>.projects.oryapis.com/sessions/whoami via httpRequest (EdgeWorkers doesn't have a fetch global). Cache responses in EdgeKV for 30-60s (fallback: per-isolate Map).
      - On valid: inject X-User-Id header; on invalid: 401 from the edge.
      - CPU budget ~50ms wall-clock — JWKS verification fits comfortably; whoami calls eat into this.
      - Wired via Akamai Property Manager attaching the EdgeWorker to a behavior on the relevant hostname/path.
      - Reference implementation: edge-token-validation/cloudflare-workers (same pattern, different runtime).
      - Status: community/proposed — documented at ory.com/docs/integrates-with/edge-token-validation/akamai-edgeworkers.
    oryMechanism:
      - standards
    protocol:
      - jwt
      - rest-api
  - name: cloudflare-workers
    displayName: Cloudflare Workers
    vendor: Cloudflare
    category: edge-token-validation
    path: edge-token-validation/cloudflare-workers
    type: session-validation
    maintainedBy: Community contributors
    status: active
    description: >-
      A Cloudflare Worker that validates Ory Network session cookies (via /sessions/whoami) or JWT Bearer tokens
      (locally against Ory's JWKS) at the Cloudflare edge before requests reach origin. Successful requests are
      forwarded with identity headers (X-User-Id, X-User-Email, X-Auth-AAL, ...) attached; unauthenticated requests are
      rejected at the edge with zero load on the backend.
    useCase: >-
      A high-traffic product wants identity enforcement to happen at the CDN tier rather than at every backend service.
      The Worker validates each request before it reaches origin, reducing latency and offloading auth from the backend,
      and adds identity headers so downstream services can attribute the request without re-validating.
    coreFunctionality: |-
      - Cloudflare Worker deployed via wrangler — runs in V8 isolates at the Cloudflare edge.
      - Two validation modes: session cookie (forwards to Ory /sessions/whoami with 30 s edge cache) and JWT Bearer token (validates RSASSA-PKCS1-v1_5 signatures against Ory's JWKS, JWKS cached at the edge for 1 h).
      - Forwards authenticated requests to origin with X-User-Id, X-Session-Id, X-User-Email, X-User-Name, X-Auth-AAL, X-User-Metadata headers.
      - Configurable PUBLIC_PATHS to skip auth on health, public, and static paths.
      - Optional LOGIN_REDIRECT_URL turns 401 into a 302 to login with return_to.
    oryMechanism:
      - session-validation
    protocol:
      - jwt
      - rest-api
  - name: fastly-compute
    displayName: 'Fastly Compute@Edge'
    vendor: Fastly
    category: edge-token-validation
    path: edge-token-validation/fastly-compute
    type: session-validation
    maintainedBy: Community contributors
    status: active
    description: >-
      Validate Ory Network session tokens and JWTs at the Fastly Compute@Edge WASM runtime before requests hit origin.
      Same shape as the canonical edge-token-validation/cloudflare-workers reference, compiled to WASM with Fastly's
      host backends API and KV Store. Documented at ory.com/docs/integrates-with/edge-token-validation/fastly-compute.
    useCase: >-
      A team running Fastly for CDN + edge compute wants Ory session / JWT validation at the edge so origin receives a
      trusted X-User-Id (or 401 from the edge for invalid tokens) without round-tripping every request.
    coreFunctionality: |-
      - WASM module (Rust / JS / AssemblyScript / TinyGo) fires on every request; reads session cookie or Authorization: Bearer.
      - Hydra JWT: verify signature against cached Ory JWKS using language-native JWT library compiled to WASM.
      - Kratos session: call https://<project>.projects.oryapis.com/sessions/whoami via a registered Fastly backend. Compute@Edge cannot make ad-hoc outbound calls — the Ory hostname MUST be registered as a named backend in the service config.
      - Caching: Fastly KV Store keyed by cookie hash for 30-60s; per-execution memory is request-scoped only.
      - Edge dictionaries for non-secret config (Ory project URL, audience IDs); edge secrets for JWKS pinning / service tokens.
      - On valid: inject X-User-Id header; on invalid: synthesize 401 at the edge.
      - Rust is the most performant; JavaScript (via Quick.js) is the easiest path porting from the Cloudflare reference.
      - Status: community/proposed — documented at ory.com/docs/integrates-with/edge-token-validation/fastly-compute.
    oryMechanism:
