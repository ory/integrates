      - Standard scopes: openid, profile, email. Default Jsonnet returns email gated on email_verified; optional
      `nickname` → `username` mapping.

      - Auth0 application type must be "Regular Web Applications"; the Ory redirect URI goes into Auth0's Allowed Callback
      URLs.

      - Common migration pattern: run Auth0 + Ory side-by-side with Auth0 as the upstream IdP, then disable the Auth0
      provider once enough users have been transparently linked to native Ory identities.
    oryMechanism:
      - standards
