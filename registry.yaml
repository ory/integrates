  - name: steam
    displayName: Steam
    vendor: Valve
    category: social-sign-in
    path: social-sign-in/steam
    type: config
    maintainedBy: Community contributors
    status: active
    description: >-
      Sign in with Steam — Valve's PC gaming platform — surfaced through Ory Network. Steam predates OAuth/OIDC and uses
      OpenID 2.0, so Kratos cannot consume it directly; a small OpenID 2.0 → OIDC proxy in front of Steam is the
      recommended bridge, with Kratos then configured as a generic OIDC provider against the proxy.
    useCase: >-
      A gaming, esports, community, or game-launcher product wants Sign in with Steam so users authenticate with their
      existing Steam identity rather than creating a separate account.
    coreFunctionality: |-
      - Steam is NOT natively supported by Kratos — it speaks OpenID 2.0 (2007 spec), not OAuth 2.0/OIDC.
      - Recommended pattern: deploy a small OpenID 2.0 → OIDC proxy that wraps Steam's `https://steamcommunity.com/openid/login` endpoint and exposes a normal OIDC issuer; configure Kratos against the proxy as a generic provider.
      - Alternative: implement Steam OpenID 2.0 in your backend and create/lookup identities via the Kratos Admin API, bypassing the social-signin subsystem.
      - Steam does NOT share email; design the identity schema to use the 64-bit Steam ID as the credential identifier.
      - A Steam Web API key (from steamcommunity.com/dev/apikey) is needed to fetch profile data via GetPlayerSummaries; profile visibility may be restricted.
      - Status: community/proposed — documented at ory.com/docs/integrates-with/social-sign-in/steam.
    oryMechanism:
      - standards
    protocol:
      - openid-2.0
  - name: telegram
    displayName: Telegram Login
    vendor: Telegram
    category: social-sign-in
    path: social-sign-in/telegram
    type: webhook
    maintainedBy: Community contributors
    status: active
    description: >-
      Telegram does not implement OAuth 2.0 / OIDC; it provides a Login Widget that posts an HMAC-SHA256-signed payload
      to a customer-provided URL. This integration is a small bridge that validates the HMAC against the Telegram bot
      token and returns the verified profile so applications can call the Ory Admin API to upsert the matching identity
      and issue a session.
    useCase: >-
      A consumer app wants Telegram as a sign-in option but Telegram has no OIDC, so Ory's native social-sign-in
      providers don't apply. The bridge validates the Login Widget HMAC inline, returns suggested identity traits, and
      the application uses Ory's Admin API to upsert the identity and start a session.
    coreFunctionality: |-
      - POST /telegram/validate verifies X-Webhook-Secret, computes HMAC-SHA256 over the sorted data_check_string with key SHA256(bot_token), and rejects expired auth_date.
      - Returns the verified profile plus suggested_identity_traits (telegram_id, name, username) for the application's Admin API upsert.
      - Configurable TELEGRAM_AUTH_MAX_AGE_SECONDS for replay window (default 24h per Telegram's recommendation; tighten for stricter session creation).
      - Stateless and read-only — does not touch Ory directly; the application owns the upsert and session-bootstrap.
    oryMechanism:
      - actions
    protocol:
      - custom
