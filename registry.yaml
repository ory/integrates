  - name: recurly
    displayName: Recurly
    vendor: Recurly
    category: payment-billing
    path: payment-billing/recurly
    type: webhook
    maintainedBy: Community contributors
    status: active
    description: >-
      Bidirectional sync between Ory Network and Recurly — Ory → Recurly creates accounts at signup; Recurly → Ory
      surfaces subscription state on the identity so application code can gate features by subscription tier without a
      separate lookup. Wired via Ory Action on registration.after + Recurly webhook to a customer-implemented handler.
    useCase: >-
      A subscription SaaS running billing on Recurly wants new Ory signups to land as Recurly accounts automatically,
      and wants Recurly subscription state (active / churned / past due) visible on the Ory identity so the application
      can gate features without a separate Recurly call per request.
    coreFunctionality: |-
      - Outbound: Ory Action on registration.after (async) → handler creates Recurly Account keyed by Ory identity id (set as account_code); PATCHes metadata_public.recurly on identity.
      - Inbound: Recurly webhook → handler verifies HMAC-SHA256 signature → resolves Ory identity by account_code → PATCHes metadata_public.recurly.subscription_state and .subscription_tier.
      - account_code is the binding between systems — set to Ory identity id during account creation.
      - Subscription gating belongs in APPLICATION CODE reading metadata_public.recurly, NOT in the auth flow — Ory shouldn't block sign-in for churned subscribers; app redirects to billing page.
      - Recurly webhooks are at-least-once; handler must be idempotent (PATCH is naturally idempotent).
      - Status: community/proposed — documented at ory.com/docs/integrates-with/payment-billing/recurly, no first-party handler.
    oryMechanism:
      - actions
    protocol:
      - rest-api
      - http-webhook
  - name: stripe
    displayName: Stripe
    vendor: Stripe
    category: payment-billing
    path: payment-billing/stripe
    type: webhook
    maintainedBy: Community contributors
    status: active
    description: >-
      Stripe is a payment-processing and subscription-billing platform. This integration creates a Stripe Customer for
      every Ory identity on registration and refreshes the identity's metadata_public.billing with the current
      subscription status on every login, so the application can gate features by plan without an extra round trip to
      Stripe.
    useCase: >-
      A SaaS product wants its session to know "is this user on Free, Pro, or Enterprise?" without each protected route
      reading from Stripe directly. The integration links the Stripe Customer to the Ory identity at registration and
      refreshes the cached billing state at every login so feature gates, billing pages, and admin tools can read
      session.identity.metadata_public.billing instead of calling Stripe.
    coreFunctionality: |-
      - Sync post-registration hook: stripe.customers.create with an idempotency key derived from identity.id, then returns metadata_admin.stripe_customer_id and a "free / none" baseline in metadata_public.billing.
      - Sync post-login hook: stripe.subscriptions.list for the linked customer, projects the latest subscription into metadata_public.billing (status, plan, current_period_end), returns it for Ory to apply.
      - Idempotency key ory-customer-<identity.id> prevents duplicate Customer creation on webhook retry.
      - Both hooks fail open: a Stripe outage returns 200 with no metadata changes so authentication never breaks.
      - Stripe API version pinned via STRIPE_API_VERSION env; bumps are explicit decisions, not silent updates.
    oryMechanism:
      - actions
    protocol:
      - rest-api
      - http-webhook
  - name: elastic-siem
    displayName: Elastic SIEM
    vendor: Elastic
    category: siem-security-analytics
    path: siem-security-analytics/elastic-siem
    type: webhook
    maintainedBy: Community contributors
    status: active
    description: >-
      Ingest Ory Network identity and authentication events into Elastic SIEM (Elasticsearch + Kibana + Detection
      Engine). Wired via Ory Actions on lifecycle hooks calling a customer-implemented handler that transforms events to
      Elastic Common Schema (ECS) documents and bulk-ingests them.
    useCase: >-
      A security team running Elastic SIEM wants Ory identity events in the same SIEM as the rest of their
      infrastructure — for correlation, detection rules (brute force, impossible travel, credential stuffing), and
      timeline analysis.
    coreFunctionality: |-
      - Pattern: Ory Action async (response.ignore: true) on registration / login / logout / verification / MFA / recovery → handler verifies shared secret → handler transforms to ECS document → handler POSTs to Elasticsearch _bulk API.
      - ECS mapping: event.action / event.category / event.outcome for the auth verb, user.id + user.email for the subject, source.ip + user_agent.original for context, authentication.factor for MFA.
      - Index pattern: logs-ory-* with an ILM policy for retention + tier transitions per compliance window.
      - Detection rules: pre-built Elastic Security Detection Engine rules (brute force, impossible travel, credential stuffing) target ECS-mapped events without custom rule authoring.
      - For Fleet-managed deployments, package as a custom Elastic Integration and ship via the Fleet UI.
      - Status: community/proposed — documented at ory.com/docs/integrates-with/siem-security-analytics/elastic-siem, no first-party handler.
    oryMechanism:
      - actions
    protocol:
      - rest-api
  - name: microsoft-sentinel
    displayName: Microsoft Sentinel
    vendor: Microsoft
    category: siem-security-analytics
    path: siem-security-analytics/microsoft-sentinel
    type: webhook
    maintainedBy: Community contributors
    status: active
    description: >-
      Ingest Ory Network identity events into Microsoft Sentinel (cloud SIEM + SOAR on Azure) via the Azure Log
      Analytics Data Collector API (or the newer Logs Ingestion API for new deployments). Wired via Ory Actions on
      lifecycle hooks calling a customer-implemented handler that signs and posts events to Log Analytics.
    useCase: >-
      A security team running Microsoft Sentinel wants Ory identity events in Sentinel for KQL hunts, analytics rules,
      and Logic Apps playbook automation — correlating identity events with the rest of the Azure security surface.
    coreFunctionality: |-
      - Pattern: Ory Action async on lifecycle hooks → handler verifies shared secret → handler signs request with Azure HMAC-SHA256 scheme using Log Analytics workspace Primary Key → POST to https://<workspace-id>.ods.opinsights.azure.com/api/logs?api-version=2016-04-01 under custom log type OryEvents_CL.
      - Sentinel auto-creates the OryEvents_CL table on first ingest; the _CL suffix is added automatically by Log Analytics.
      - KQL analytics rules in Sentinel query OryEvents_CL for detection logic; Logic Apps playbooks automate response.
      - Data Collector API is being deprecated in favor of the Logs Ingestion API + DCRs (Data Collection Rules) — new deployments should target the newer API; watch the deprecation timeline.
      - Alternative: use Logic Apps as the intermediary — single Logic App receives the Ory Action webhook and posts to Sentinel, removing the need for custom handler code.
      - Status: community/proposed — documented at ory.com/docs/integrates-with/siem-security-analytics/microsoft-sentinel, no first-party handler.
    oryMechanism:
      - actions
    protocol:
      - rest-api
  - name: splunk
    displayName: Splunk
    vendor: Splunk
    category: siem-security-analytics
    path: siem-security-analytics/splunk
    type: webhook
    maintainedBy: Community contributors
    status: active
    description: >-
      Splunk is a SIEM and operational-intelligence platform. This integration forwards Ory identity-flow events
      (registration, login, recovery, settings) to Splunk's HTTP Event Collector, shaped to the Common Information Model
      Authentication data model so search, dashboards, and alerts work without per-event extraction.
    useCase: >-
      A security team needs Ory authentication events in their existing Splunk SIEM so credential-stuffing, brute-force,
      impossible-travel, MFA-disabled, and account-takeover detections can run against identity activity alongside the
      rest of their telemetry, without making Splunk a critical-path dependency of user flows.
    coreFunctionality: |-
      - Four async Ory Action endpoints (/splunk/registration, /splunk/login, /splunk/recovery, /splunk/settings); each returns 200 immediately so user flows are never blocked.
      - Builds a CIM Authentication event with action, app, src, src_user, user, authentication_method, signature, and signature_id fields.
      - POSTs to Splunk HEC at /services/collector/event with Authorization: Splunk <token>, configurable index/source/sourcetype/host.
      - Fire-and-forget: HEC errors and timeouts are logged but dropped so Splunk outages never affect Ory.
      - Authentication method inference from flow.type (oidc / totp / webauthn / lookup_secret / fallback password).
    oryMechanism:
      - actions
    protocol:
      - rest-api
  - name: sumo-logic
    displayName: Sumo Logic
    vendor: Sumo Logic
    category: siem-security-analytics
    path: siem-security-analytics/sumo-logic
    type: config
    maintainedBy: Community contributors
    status: active
    description: >-
      Ingest Ory Network identity events into Sumo Logic (log management + Cloud SIEM) via an HTTP Source on a Hosted
      Collector — the simplest ingest path of any SIEM. Ory Action POSTs directly to the tokenized HTTP Source URL; no
      webhook handler needed. Documented at ory.com/docs/integrates-with/siem-security-analytics/sumo-logic.
    useCase: >-
      A security team running Sumo Logic wants Ory identity events in Sumo with the lowest setup friction — Sumo's HTTP
      Source accepts unauthenticated POSTs to a unique tokenized URL, so the Ory Action can post directly without a
      handler in between.
    coreFunctionality: |-
      - Pattern: Ory Action async (response.ignore: true) POSTs JSON body directly to Sumo Logic Hosted Collector's HTTP Source URL — no handler in between.
      - Sumo HTTP Source URL is the auth — treat as a secret; rotate via Sumo if leaked.
      - Source Category (e.g. ory/identity-events) drives downstream search and partition rules.
      - Cloud SIEM: parse events into Sumo's normalized schema via Field Extraction Rule (FER) or parsing job to enable out-of-the-box detection rules (credential stuffing, brute force, impossible travel).
      - Body Jsonnet on each Ory Action emits the relevant event fields as JSON; Sumo auto-parses.
      - For high-volume products, set retention + partition rules in Sumo to manage cost.
      - Status: community/proposed — documented at ory.com/docs/integrates-with/siem-security-analytics/sumo-logic.
    oryMechanism:
      - actions
    protocol:
      - rest-api
  - name: messagebird
