  - name: zendesk
    displayName: Zendesk
    category: support-helpdesk
    path: support-helpdesk/zendesk
    maintainedBy: Community contributors
    type: webhook
    description: >-
      Zendesk is a customer-service platform for ticketing, live chat, and knowledge bases. This integration mirrors Ory
      identities into Zendesk users via async lifecycle webhooks and exposes a sidebar lookup endpoint that a Zendesk app
      can call to render identity context (state, MFA, sessions, plan, risk) inline on every ticket.
    status: active
    vendor: Zendesk
    useCase: >-
      A B2B SaaS support team wants the Zendesk agent view to surface "who is this customer" without leaving the ticket —
      subscription plan, MFA status, active sessions, last login — and wants tickets correlated cleanly back to the Ory
      identity record for downstream reporting.
    coreFunctionality: >-
      - Receives async post-registration and post-settings Ory Action webhooks, returns 200 immediately so user flows are
      never blocked.

      - Calls Zendesk POST /api/v2/users/create_or_update to upsert the corresponding Zendesk user, copying identity.id
      into external_id and selected metadata into Zendesk user_fields.

      - Exposes GET /zendesk/sidebar/identity?email=... for a Zendesk sidebar app, gated by a separate
      ZENDESK_SIDEBAR_SECRET so the Ory webhook secret can't be reused to enumerate identities.

      - Sidebar response includes state, MFA enrollment, active session count, last login, and metadata_public for inline
      agent-side rendering.

      - Distinguishes ory_lookup_failed (502) from no-match (404) so the sidebar can render "no Ory identity found"
      without false alarms.
    oryMechanism:
      - actions-webhook
  - name: clearbit
    displayName: Clearbit
    category: user-enrichment
    path: user-enrichment/clearbit
    maintainedBy: Community contributors
    type: webhook
    description: >-
      DEPRECATED. Clearbit's standalone enrichment API is closed to new customers after the HubSpot acquisition; its
      capabilities now live inside HubSpot Breeze Intelligence (a CRM UI feature with no external API). This integration
      retains the original async post-registration webhook that calls Clearbit's Combined API and writes person and
      company data to identity metadata_admin, kept for legacy contracts only.
    status: deprecated
    vendor: Clearbit
    useCase: >-
      A B2B SaaS with a legacy Clearbit contract wants firmographic and demographic context (company name, industry,
      headcount, role, seniority) on every signup for lead routing, feature gating, and personalized onboarding, without
      expanding the registration form. New customers should use user-enrichment/fullcontact or user-enrichment/zoominfo.
    coreFunctionality: >-
      - Receives the async post-registration Ory Action webhook, returns 200 immediately so registration is never blocked
      by enrichment.

      - Calls Clearbit's /v2/combined/find endpoint with the user's email to retrieve person and company data.

      - Projects the response to a compact metadata shape (person.name/role/title/seniority,
      company.name/domain/industry/employees/raised/etc.).

      - Fetches the identity via the Ory Admin API, merges the projection into metadata_admin.clearbit, and PUTs the
      identity back.

      - Silently no-ops when Clearbit returns 404/422 (free email providers, missing data).
    oryMechanism:
      - actions-webhook
