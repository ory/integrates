  - name: cloudflare-workers
    displayName: Cloudflare Workers
    category: edge-token-validation
    path: edge-token-validation/cloudflare-workers
    maintainedBy: Community contributors
    type: session-validation
    description: >-
      A Cloudflare Worker that validates Ory Network session cookies (via /sessions/whoami) or JWT Bearer tokens (locally
      against Ory's JWKS) at the Cloudflare edge before requests reach origin. Successful requests are forwarded with
      identity headers (X-User-Id, X-User-Email, X-Auth-AAL, ...) attached; unauthenticated requests are rejected at the
      edge with zero load on the backend.
    status: active
    vendor: Cloudflare
    useCase: >-
      A high-traffic product wants identity enforcement to happen at the CDN tier rather than at every backend service.
      The Worker validates each request before it reaches origin, reducing latency and offloading auth from the backend,
      and adds identity headers so downstream services can attribute the request without re-validating.
    coreFunctionality: >-
      - Cloudflare Worker deployed via wrangler — runs in V8 isolates at the Cloudflare edge.

      - Two validation modes: session cookie (forwards to Ory /sessions/whoami with 30 s edge cache) and JWT Bearer token
      (validates RSASSA-PKCS1-v1_5 signatures against Ory's JWKS, JWKS cached at the edge for 1 h).

      - Forwards authenticated requests to origin with X-User-Id, X-Session-Id, X-User-Email, X-User-Name, X-Auth-AAL,
      X-User-Metadata headers.

      - Configurable PUBLIC_PATHS to skip auth on health, public, and static paths.

      - Optional LOGIN_REDIRECT_URL turns 401 into a 302 to login with return_to.
    oryMechanism:
      - session-validation
