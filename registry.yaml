      - First-party Kratos OIDC provider (`provider: amazon`); registered as an "OpenID Connect provider" in the Ory Console wizard.
      - Standard scope `profile` (also `postal_code` if needed). Amazon doesn't issue an id_token, so Ory calls the LWA customer-profile API and exposes name / email as claims.
      - Default Jsonnet maps email to traits.email; email may be empty if the user denied the email permission on the consent screen.
