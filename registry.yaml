      - courier-spi
    protocol:
      - rest-api
  - name: twilio
    displayName: Twilio
    vendor: Twilio
    category: sms-providers
    path: sms-providers/twilio
    type: config
    maintainedBy: Community contributors
    status: active
    description: >-
      Use Twilio Programmable SMS as the HTTP SMS courier for Ory Network OTPs and verification codes. Twilio is the
      most widely deployed cloud SMS platform and is the canonical example used in the Ory SMS docs.
    useCase: >-
      Default SMS provider for most Ory Network customers shipping phone-based verification or MFA — broad carrier
      coverage, mature tooling, and the path of least resistance off the existing Ory documentation.
    coreFunctionality: |-
      - Configured via Kratos's HTTP SMS courier (no code) per docs/kratos/emails-sms/sending-sms (the example uses Twilio directly).
      - Endpoint POST https://api.twilio.com/2010-04-01/Accounts/<SID>/Messages.json with HTTP Basic auth (Account SID : Auth Token).
      - Content-Type MUST be application/x-www-form-urlencoded (Twilio rejects JSON); body is URL-encoded To, From, Body.
      - For production, prefer a Twilio Messaging Service (replace From=... with MessagingServiceSid=MGxxxx...) for sender pooling and per-country routing.
      - Twilio Test Credentials (separate SID/Token) simulate sends without delivery or charges — useful for CI.
    oryMechanism:
      - courier-spi
    protocol:
      - rest-api
  - name: vonage
    displayName: Vonage (Nexmo)
    vendor: Vonage
    category: sms-providers
    path: sms-providers/vonage
    type: config
    maintainedBy: Community contributors
    status: active
    description: >-
      Use Vonage (formerly Nexmo) as the HTTP SMS courier for Ory Network OTPs and verification codes. Strong EMEA and
      APAC carrier coverage and competitive international pricing make Vonage a common alternative to Twilio for
      products with significant non-US user bases.
    useCase: >-
      An Ory Network customer with EMEA/APAC user concentration wants SMS delivery from a vendor strongest in those
      regions, in addition to or instead of US-centric Twilio.
    coreFunctionality: |-
      - Configured via Kratos's HTTP SMS courier (no code) per docs/kratos/emails-sms/sending-sms.
      - Endpoint POST https://rest.nexmo.com/sms/json. Authentication is API key + secret in the request BODY (not headers), so the Kratos courier `auth` block stays empty and credentials live in the Jsonnet template.
      - JSON body: api_key, api_secret, from (alphanumeric ID up to 11 chars OR a Vonage virtual number — alphanumeric not allowed in US/Canada), to, text.
      - Vonage accepts E.164 with or without leading "+"; strip in Jsonnet if a country rejects the + form.
      - Newer Messages API (api.nexmo.com/v1/messages) available with JWT/header auth; the REST SMS API above is simpler for SMS-only use.
    oryMechanism:
      - courier-spi
    protocol:
      - rest-api
  - name: whatsapp
    displayName: WhatsApp Business
    vendor: WhatsApp Business
    category: sms-providers
    path: sms-providers/whatsapp
    type: webhook
    maintainedBy: Community contributors
    status: active
    description: >-
      WhatsApp Business Cloud API as a delivery channel for Ory Kratos OTPs and verification codes. This integration
      takes the same Kratos courier-spi mechanism used for SMS providers like Twilio and routes the message through
      WhatsApp Business instead, using a pre-approved AUTHENTICATION-category template. WhatsApp does not provide
      standard OAuth/OIDC login, so this is the practical path for "WhatsApp login" — passwordless OTP via WhatsApp.
    useCase: >-
      A consumer product wants WhatsApp as the OTP channel for verification, recovery, and MFA (instead of SMS) — a
      common request in markets where WhatsApp adoption is higher than SMS deliverability. Kratos generates the OTP
      exactly as it would for SMS; the integration intercepts the courier delivery and sends it through WhatsApp's Cloud
      API as an authentication-template message.
    coreFunctionality: |-
      - Kratos courier-spi HTTP target (configured via kratos-courier.yaml, not ory-actions.yaml).
      - Extracts the OTP from the rendered Kratos body via strict regex /\b(?:code|pin|otp)[^\d]{0,16}(\d{4,10})\b/i.
      - Normalizes recipient to E.164 (leading "+" then digits).
      - POSTs to graph.facebook.com/{version}/{phone_id}/messages with type: template, sending the OTP as both the body parameter and the copy-code button parameter.
      - 422 otp_extract_failed when the message body doesn't yield a digit run — explicit instead of silently sending an empty template.
    oryMechanism:
      - courier-spi
    protocol:
      - rest-api
