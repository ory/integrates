    coreFunctionality: |-
      - Receives Ory post-login and post-registration Action webhooks.
      - Forwards the identity, request context, and Castle device token to Castle's Risk API.
      - Translates Castle's response into Ory flow control: 400 to block, 200 + requires_mfa_stepup=true to step up, 200 with risk score in metadata to allow.
      - Records the risk assessment in identity metadata for downstream auditing and policy decisions.
      - Fails open on Castle outages so authentication never breaks because of Castle availability.
    oryMechanism:
      - actions
    protocol:
      - rest-api
