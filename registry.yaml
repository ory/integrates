      runs inline with Ory login and relays the verdict so Ory issues the session only on approval.
    coreFunctionality: |-
      - Sync post-login Ory Action webhook (response.parse: true, can_interrupt: true).
      - GET /api/v1/users/{user_id}/factors → finds the active push factor.
      - POST /api/v1/users/{user_id}/factors/{factor_id}/verify → sends the push, gets a poll URL.
      - Polls the poll URL every 2 s until factorResult ≠ WAITING or OKTA_POLL_DEADLINE_SECONDS elapses.
      - Returns { result: SUCCESS / REJECTED / TIMEOUT / WAITING, mfa_passed } so the post-flow Action can gate the session.
      - 502 on Okta errors (SSWS revoked, factor lookup 404) so Okta outages never silently grant MFA.
    oryMechanism:
