  - name: apple
    displayName: Apple
    category: social-sign-in
    path: social-sign-in/apple
    maintainedBy: Ory Engineering
    type: config
    description: >-
      Sign in with Apple as a social sign-in provider in Ory Network. Privacy-focused OAuth2 with Hide My Email relay
      addresses; uses JWT-signed client assertions (Apple Team ID + Private Key) rather than a plain client secret.
      Required for iOS apps that offer any third-party social login per Apple's App Store guidelines.
    status: active
    vendor: Apple
    useCase: >-
      A consumer product (especially one with an iOS app) needs to offer Sign in with Apple to comply with App Store
      Review Guideline 4.8. The integration handles both the webbrowser flow and the native-iOS SDK flow where Apple
      returns an id_token that's exchanged at Ory.
    coreFunctionality: >-
      - First-party Kratos OIDC provider (`provider: apple`); provider ID MUST be "apple" so Ory exempts the form-POST
      callback from CSRF middleware.

      - JWT-signed client assertion: requires Apple Team ID, Services ID (used as Client ID), Key ID, and the .p8 Private
      Key contents.

      - Automatic account linking supported for Apple consumer accounts that share a verified email with an existing
      identity.

      - Native iOS flow: app obtains id_token via Apple's SDK and submits it as `id_token` on
      updateRegistration/LoginFlow; Ory validates against Apple's signing keys.

      - Hide My Email: Apple returns a relay address (privaterelay.appleid.com) instead of the user's real address;
      persist this verbatim in traits.email.
    oryMechanism:
      - standards
