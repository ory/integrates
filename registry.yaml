  - name: recaptcha
    displayName: Google reCAPTCHA
    vendor: Google
    category: fraud-bot-protection
    path: fraud-bot-protection/recaptcha
    type: webhook
    maintainedBy: Community contributors
    status: active
    description: >-
      Google reCAPTCHA protects authentication flows from automated abuse. v2 issues a visible or invisible challenge
      and returns a pass/fail token; v3 runs entirely in the background and returns a score from 0.0 (bot) to 1.0
      (human). This integration adds reCAPTCHA support to Ory Network (which natively integrates Cloudflare Turnstile
      only) via a sync pre-flow Action webhook that validates the client-side token against Google's siteverify API and
      interrupts the flow on a fail.
    useCase: >-
      A consumer-facing product wants to stop bot signups and credential-stuffing attempts without enrolling in
      Cloudflare Turnstile. The team already runs Google reCAPTCHA elsewhere and wants the same protection on Ory-hosted
      registration and login flows.
    coreFunctionality: |-
      - Sync pre-registration and pre-login hook (response.parse: true, can_interrupt: true).
      - Extracts the reCAPTCHA token from transient_payload.recaptcha_token and verifies it against https://www.google.com/recaptcha/api/siteverify.
      - For v2 returns pass on success: true; for v3 also enforces RECAPTCHA_SCORE_THRESHOLD and optional RECAPTCHA_EXPECTED_ACTION.
      - Returns 400 + a flow-level error message ("CAPTCHA verification failed") to interrupt the flow, or 200 + empty body to let it proceed.
      - Fails closed on a siteverify outage so a Google-API hiccup doesn't silently disable bot protection.
    oryMechanism:
      - actions
    protocol:
      - rest-api
  - name: sift
    displayName: Sift
    vendor: Sift
    category: fraud-bot-protection
    path: fraud-bot-protection/sift
    type: webhook
    maintainedBy: Community contributors
    status: active
    description: >-
      Digital trust & safety via Sift — real-time ML-based fraud and account-abuse scoring. Wired into Ory via two
      Actions: a sync pre-flow check (registration.before / login.before with can_interrupt) reading the user's current
      Sift abuse score and blocking when above threshold, plus an async post-event reporter emitting Sift events that
      feed the model.
    useCase: >-
      A consumer product (marketplace, fintech, gaming) needs ML-driven account-abuse prevention beyond bot defense —
      repeat-fraudster detection, payment-fraud signals, network-effect risk — and is willing to feed Sift the event
      stream needed to build a useful longitudinal model.
    coreFunctionality: |-
      - Two flows must run for Sift to be useful: pre-flow check (block on fail) AND post-event reporter (signal collection).
      - Pre-flow: GET https://api.sift.com/v205/users/{user_id}/score; block if score > threshold (start permissive at 80, tighten with data).
      - Post-event: POST https://api.sift.com/v205/events with reserved event names ($create_account, $login, $transaction) including IP, user agent, session, traits.
      - Both flows authenticated via a single server-side API Key.
      - User IDs must be stable across sessions — Sift's model is keyed on user_id.
      - Sift's value is longitudinal — single events have limited signal; payoff grows over time as the model learns the user base.
      - Status: community/proposed — documented at ory.com/docs/integrates-with/fraud-bot-protection/sift.
    oryMechanism:
      - actions
