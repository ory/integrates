    category: identity-verification
    path: identity-verification/socure
    type: webhook
    maintainedBy: Community contributors
    status: active
    description: >-
      Run Socure ID+ (ML-based identity verification with strong fraud signals — device fingerprint, email reputation,
      network risk, KYC, phone risk) from an Ory Action webhook during registration. Supports both the sync path (Socure
      returns a verdict immediately) and the async path (Socure POSTs the final verdict back to /socure/results-callback
      when long-running checks complete).
    useCase: >-
      A regulated B2C product needs ML-driven identity verification at signup with strong fraud signals beyond document
      checks — device, email, network, phone risk — and wants a single deployment that handles both fast and slow Socure
      verdict paths.
    coreFunctionality: |-
      - Sync path: POST /socure/verify-identity (Ory Action target on registration.after); calls Socure ID+ POST /api/3.0/EmailAuthScore with configured SOCURE_MODULES; returns reference_id / decision (kyc.fieldValidations) / fraud_score for the response-parse Jsonnet to apply policy.
      - Async path: POST /socure/results-callback (FROM Socure when async checks complete); HMAC-SHA256 over raw body via X-Socure-Signature; when ORY_SDK_URL + ORY_ADMIN_API_KEY are set, PATCHes the final decision to metadata_public.socure_decision on the matching identity.
      - SOCURE_MODULES configures which signals run (commonly kyc, fraud, phonerisk).
      - Single deployment, single binary handles both paths — async config is optional.
      - Authenticated via shared ORY_WEBHOOK_SECRET (sync) and SOCURE_CALLBACK_SECRET (async HMAC).
    oryMechanism:
      - actions
    protocol:
      - rest-api
      - http-webhook
  - name: duo-security
    displayName: Duo Security
    vendor: Cisco
    category: mfa
    path: mfa/duo-security
    type: webhook
    maintainedBy: Community contributors
    status: active
    description: >-
      Duo Security (a Cisco company) is an enterprise MFA platform with strong push and passcode flows. This integration
      sends a Duo push challenge from an Ory Action webhook on login, polls Duo for the user's response, and returns the
      verdict so Ory can step up authentication or fail the flow.
    useCase: >-
      An enterprise has already standardized its workforce on Duo Mobile for MFA and wants to reuse that enrollment from
      Ory-hosted login flows without re-enrolling users in Ory's native TOTP/WebAuthn. Duo's push challenge runs inline
      with Ory login; the integration relays the verdict so Ory can issue the session or fail the flow.
    coreFunctionality: |-
      - Sync post-login Ory Action webhook (response.parse: true, can_interrupt: true).
      - Signs Duo Auth API requests with HMAC-SHA1 over a canonicalized request line per Duo's spec.
      - POSTs /auth/v2/auth (factor=push, async=1) and long-polls /auth/v2/auth_status?txid=... until the user responds or DUO_POLL_DEADLINE_SECONDS elapses.
      - Returns { result: allow | deny | waiting, mfa_passed } so the post-flow Action can gate the session.
      - 502 on Duo errors so a Duo outage never silently grants MFA.
    oryMechanism:
      - actions
    protocol:
      - rest-api
  - name: okta-verify
    displayName: Okta Verify
    vendor: Okta
    category: mfa
