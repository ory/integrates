    useCase: >-
      A B2C product wants to keep credential-stuffing and account-takeover attempts out of its login flow without
      blocking legitimate users behind a CAPTCHA. Castle scores each login in real time; the integration applies an
      allow / challenge / deny decision before the session is issued, with challenge events flagged for MFA step-up in
