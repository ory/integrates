    maintainedBy: Community contributors
    status: active
    description: >-
      Sync new Ory Network users into a Mailchimp audience (subscriber list) via Ory Actions so newly registered users
      automatically land in the marketing CRM. Distinct from the Mailchimp Transactional (Mandrill) integration under
      email-providers, which sends transactional emails — this one is for marketing campaigns and audience management.
    useCase: >-
      A consumer or SaaS product running marketing on Mailchimp wants every newly registered Ory user to appear in the
      right Mailchimp audience, tagged with traits collected at registration, without writing a separate sync job or
      relying on manual exports.
    coreFunctionality: |-
      - Implemented as an Ory Actions webhook on `flows.registration.after.hooks` that calls Mailchimp's Lists/Audiences API.
      - Jsonnet template maps Ory identity traits (email, name, custom traits) into Mailchimp merge fields and audience tags.
      - Synchronous or asynchronous webhook execution depending on whether registration should block on the Mailchimp call.
      - Authentication via Mailchimp Marketing API key (separate from the Mandrill API key used by the transactional integration).
      - Documented at https://www.ory.com/docs/actions/integrations/mailchimp.
    oryMechanism:
      - actions
    protocol:
      - rest-api
  - name: mixpanel
    displayName: Mixpanel
    vendor: Mixpanel
    category: cdp-analytics
    path: cdp-analytics/mixpanel
    type: config
    maintainedBy: Community contributors
    status: active
    description: >-
      Send Ory authentication events into Mixpanel (product analytics) via the Ingestion API. Ory Action POSTs directly
      to Mixpanel's /track endpoint — no webhook handler needed; Project Token (or Service Account) authenticates.
    useCase: >-
      A consumer product wants identity events (registration / login / verification / MFA) in Mixpanel funnels and
      retention dashboards alongside in-product events — without standing up a webhook handler.
    coreFunctionality: |-
      - Pattern: Ory Action async POSTs directly to https://api.mixpanel.com/track?ip=0 (or api-eu.mixpanel.com for EU residency) — no handler in between.
      - Authentication: Project Token in the event payload (properties.token), OR HTTP Basic with Service Account credentials (preferred for server-to-server).
      - Stable distinct_id: use Ory's identity id, NOT email — Mixpanel identity merges break if distinct_id changes.
      - $insert_id for deduplication: set to Ory's flow id so retries don't double-count events.
      - ip=0 disables Mixpanel's IP geolocation when the request comes from your server, not the user.
      - User-property updates via /engage endpoint with $set operations for trait-change tracking.
      - Status: community/proposed — documented at ory.com/docs/integrates-with/cdp-analytics/mixpanel.
    oryMechanism:
      - actions
    protocol:
      - rest-api
  - name: mparticle
