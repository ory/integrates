  - name: yubikey
    displayName: YubiKey (WebAuthn / FIDO2)
    vendor: Yubico
    category: mfa
    path: mfa/yubikey
    type: config
    maintainedBy: Ory Engineering
    status: active
    description: >-
      YubiKey hardware security keys via WebAuthn / FIDO2 — natively supported by Ory Network with no integration code
      required. Configure the WebAuthn method in Project Settings and users can register YubiKeys (or other FIDO2
      authenticators — TouchID, Windows Hello, etc.) as second factor or first-factor passkey. Documented directly in
      the Ory MFA docs.
    useCase: >-
      A consumer or B2B product wants phishing-resistant MFA — WebAuthn binds credentials to origins, so a phishing site
      at look-alike domain cannot steal a credential registered for the real auth domain. YubiKeys are the hardware
      reference but the same mechanism backs TouchID / Windows Hello / Android biometrics.
    coreFunctionality: |-
      - Configured per Ory docs at /kratos/mfa/webauthn-fido-yubikey; Ory Console → Authentication → Multi-factor → enable WebAuthn.
      - Relying Party (RP) config: id (eTLD+1 the credential is scoped to), origins (full URLs users sign in from), display_name (shown in enrollment prompt).
      - Covers all FIDO2 authenticators (YubiKey, TouchID, Face ID, Windows Hello, Android biometrics) — "YubiKey" in the doc title is historical.
      - Phishing-resistant: WebAuthn binds credential to origin, blocking credential theft via look-alike domains.
      - AAL2 (NIST 800-63) compliance: WebAuthn satisfies AAL2 paired with a password-or-passkey first factor.
      - Critical operational constraint: RP id cannot change after credentials are issued — registered credentials become unusable.
      - Passkeys: same mechanism used as primary credential rather than second factor; configure via the passwordless variant.
    oryMechanism:
      - standards
    protocol:
      - webauthn
  - name: datadog
    displayName: Datadog
    vendor: Datadog
    category: monitoring-observability
    path: monitoring-observability/datadog
    type: config
    maintainedBy: Ory Engineering
    status: active
    description: >-
      Monitor self-hosted Ory in Datadog over OpenTelemetry. Ory's tracer emits OTLP, which Datadog ingests either via
      the Datadog Agent's OTLP receiver or via Datadog's agentless OTLP intake. Self-hosted only: Ory Network does not
      export telemetry to customer-owned collectors.
    useCase: >-
      An Ory customer running on Datadog wants identity-flow traces and metrics in the same pane of glass as the rest of
      their app — to debug latency in login/registration/MFA, alert on auth-error rates, and correlate identity events
      with downstream service calls.
    coreFunctionality: |-
      - There is no `datadog` tracing provider: TRACING_PROVIDER accepts otel, jaeger, or zipkin. Reach Datadog with TRACING_PROVIDER=otel over OTLP.
      - Ory's span helper sets Datadog-convention error attributes (error.message, error.stack, error.type), so OTLP traces render correctly in Datadog APM.
      - Ingest either via the Datadog Agent's OTLP receiver (otlp_config.receiver, ports 4317/4318) or directly to Datadog's OTLP intake (DD-API-KEY header, region-specific endpoints).
      - Prometheus metrics on /metrics/prometheus (each Ory service, admin port); ingest via the Datadog Agent's OpenMetrics check.
      - Ory Network: not available — managed project config excludes operational settings (tracing, logging, port).
    oryMechanism:
      - standards
    protocol:
      - otlp
      - rest-api
  - name: new-relic
