  - name: skyfire
    displayName: Skyfire
    vendor: Skyfire
    category: agent-identity
    path: agent-identity/skyfire
    type: config
    maintainedBy: Community contributors
    status: active
    description: >-
      Pair Skyfire's "Know Your Agent" (KYA) verification with Ory for AI-agent identity — Skyfire issues verifiable
      credentials per agent; a customer-built provisioning service maps each Skyfire agent to an Ory Kratos identity,
      and Hydra issues OAuth2 access tokens (client_credentials) for the agent to call APIs.
    useCase: >-
      A product running autonomous AI agents that need to authenticate to backend APIs wants the agents to have
      verifiable identity (so the call site can answer "which agent is this and is it KYA-verified") plus per-agent
      spend controls — patterns that combining Skyfire and Ory makes natural.
    coreFunctionality: |-
      - Each agent = one Kratos identity (not one user with multiple agents) — keeps audit and revocation clean.
      - metadata_public.skyfire stores agent_id + kya_status on the Kratos identity.
      - Ory Hydra issues access tokens via client_credentials; sub = Kratos identity id.
      - API gateways validate tokens at the edge (see api-gateways/*) and can read metadata_public.skyfire.agent_id for access control.
      - Skyfire can revoke agents — periodically re-check KYA status before token issuance to respect revocations.
      - Payment / spend controls stay on the Skyfire side.
      - Status: community/proposed — emerging space, reference architecture more than turnkey product.
    oryMechanism:
      - standards
    protocol:
      - oauth2
      - rest-api
  - name: tetrate
    displayName: Tetrate Agent Router Enterprise
    vendor: Tetrate
    category: agent-identity
    path: agent-identity/tetrate
    type: config
    maintainedBy: Community contributors
    status: active
    description: >-
      Pair Tetrate Agent Router Enterprise (an enterprise AI gateway built on Envoy AI Gateway) with Ory for dynamic,
      granular control over enterprise AI agents. Ory provides identity and authorization — Hydra issues OAuth2/OIDC
      tokens for agents and Keto holds the fine-grained policies — while Tetrate enforces those policies on live traffic
      when agents call models, tools, and enterprise services, down to parameter-level control over MCP tool calls.
    useCase: >-
      An enterprise running autonomous AI agents wants per-agent, per-tool, and per-parameter access control with
      step-up authorization — e.g. an agent processes routine refunds automatically but must trigger an Ory approval
      flow for larger amounts, or accesses standard records freely but needs elevated, short-lived access for sensitive
      data.
    coreFunctionality: |-
      - Two-layer architecture: Ory is the authorization/policy layer (what an agent or user may access at the resource level); Tetrate Agent Router Enterprise is the network/gateway layer that enforces policy on live traffic.
      - Agents are first-class identities authenticated through Ory; Hydra issues OAuth2/OIDC tokens via client_credentials.
      - Authorization policies defined in Ory Keto; Tetrate evaluates each agent request (tool call + request parameters) against them at the point an agent invokes an MCP tool.
      - Parameter-level enforcement: Tetrate can gate not just which tools an agent may use but which request parameters are allowed, based on Keto policies.
      - Step-up auth: requests exceeding a risk threshold can pause, trigger an authentication/approval flow through Ory, and issue short-lived elevated access.
      - Tetrate Agent Router Enterprise is built on Envoy AI Gateway — see api-gateways/envoy for the underlying Ory-token-at-the-edge pattern.
      - Status: community/proposed — announced partnership (Tetrate + Ory, 2026); reference architecture more than turnkey product.
    oryMechanism:
      - standards
    protocol:
      - oauth2
      - rest-api
  - name: apigee
    displayName: Google Apigee
    vendor: Google Cloud
    category: api-gateways
    path: api-gateways/apigee
    type: config
    maintainedBy: Community contributors
    status: active
    description: >-
      Validate Ory-issued JWTs at the Google Apigee gateway layer using Apigee's VerifyJWT policy in a SharedFlow,
      fetching the JWKS from Ory Network's well-known endpoint. Documented at
      ory.com/docs/integrates-with/api-gateways/apigee — standard JWT-at-the-edge pattern; Ory side is just JWKS
      exposure.
    useCase: >-
      An enterprise API team running Apigee wants OAuth2 access tokens issued by Ory (Hydra) validated at the gateway
      layer so backend services don't need to re-validate every request.
    coreFunctionality: |-
      - SharedFlow with VerifyJWT policy: PublicKey JWKS URL points at Ory's https://<project>.projects.oryapis.com/.well-known/jwks.json; Issuer = the Ory project URL; Audience = the API's audience identifier from Ory's OAuth2 client.
      - Algorithm RS256; Apigee caches the JWKS by URL — tune CacheTTLInSeconds for the freshness/KMS-call trade-off.
      - Apigee KVM holds per-environment audience values without redeploying the shared flow.
      - For claim-based authorization (per-scope or per-role checks), add an AssignMessage or JavaScript policy after VerifyJWT to inspect the JWT claims.
      - SharedFlow attached to the API proxy's PreFlow runs before every request.
      - Status: community/proposed — documented at ory.com/docs/integrates-with/api-gateways/apigee.
    oryMechanism:
      - standards
    protocol:
      - jwt
  - name: aws-api-gateway
    displayName: AWS API Gateway
    vendor: Amazon Web Services
    category: api-gateways
    path: api-gateways/aws-api-gateway
    type: config
    maintainedBy: Community contributors
    status: active
    description: >-
      Validate Ory-issued JWTs at the AWS API Gateway layer using a Lambda authorizer (REST API) or a native JWT
      authorizer (HTTP API). The Lambda authorizer fetches Ory's JWKS, verifies the token, and returns an IAM policy;
      API Gateway caches the policy by token for ~300s. Documented at
      ory.com/docs/integrates-with/api-gateways/aws-api-gateway — universal pattern.
    useCase: >-
      A team running APIs on AWS API Gateway wants Ory-issued OAuth2 access tokens validated at the gateway so backend
      services don't need to re-validate every request and can read the trusted `sub` from request context.
    coreFunctionality: |-
      - REST API: Lambda authorizer (Node.js / Python) verifies bearer JWT against https://<project>.projects.oryapis.com/.well-known/jwks.json with kid-based key selection; returns IAM policy + principalId (= JWT sub).
      - HTTP API: native JWT authorizer pointing directly at the Ory issuer URL — no Lambda required for standard verification.
      - Caching: REST uses authorizerResultTtlInSeconds (default 300s); HTTP uses resultsCacheTtlInSeconds. Tune for cold-start vs. revocation latency.
      - Use Lambda authorizer over native JWT when custom claim-based authorization logic is needed beyond signature/issuer/audience checks.
      - Cold start matters — keep the authorizer minimal; aws-jwt-verify is a lean JWKS library.
      - Status: community/proposed — documented at ory.com/docs/integrates-with/api-gateways/aws-api-gateway.
    oryMechanism:
      - standards
    protocol:
      - jwt
  - name: envoy
    displayName: Envoy
    vendor: Envoy Proxy (CNCF)
    category: api-gateways
    path: api-gateways/envoy
    type: config
    maintainedBy: Community contributors
    status: active
    description: >-
      Validate Ory-issued JWTs or Kratos sessions at the Envoy proxy layer. Envoy's native `jwt_authn` HTTP filter
      verifies Hydra-issued OAuth2 access tokens against Ory's JWKS before requests reach upstream; the `ext_authz`
      filter delegates to Ory Oathkeeper or a small validator service for Kratos session-cookie checks. Documented at
      ory.com/docs/integrates-with/api-gateways/envoy — standard token-at-the-edge pattern; the Ory side is just JWKS
      exposure or /sessions/whoami.
    useCase: >-
      A team running Envoy (standalone, or as the data plane under a mesh / gateway) wants Ory-issued tokens validated
      at the proxy so upstream services receive a trusted identity (or a 401 from the edge) without re-validating every
      request themselves.
    coreFunctionality: |-
      - Path A (Hydra JWTs): `jwt_authn` HTTP filter with a remote_jwks pointing at https://<project>.projects.oryapis.com/.well-known/jwks.json; set issuer to the Ory project URL and audiences to the API's audience. Envoy caches the JWKS and refreshes on the configured interval.
      - Path B (Kratos sessions): `ext_authz` HTTP filter calls Ory Oathkeeper (or a small validator) which hits /sessions/whoami; on success Envoy forwards identity headers (X-User-Id, X-User-Email) upstream, on failure returns 401 at the edge.
      - Verified JWT claims can be forwarded upstream via the filter's payload_in_metadata / forwarding settings for downstream authorization.
      - Works the same whether Envoy is standalone, an Istio sidecar/gateway, or the data plane under a managed gateway.
      - Tetrate Agent Router Enterprise (see agent-identity/tetrate) is built on Envoy AI Gateway and applies this pattern to AI-agent traffic.
      - Status: community/proposed — documented at ory.com/docs/integrates-with/api-gateways/envoy; shape still being defined.
    oryMechanism:
      - standards
    protocol:
      - jwt
      - rest-api
  - name: kong
    displayName: Kong API Gateway
    vendor: Kong
    category: api-gateways
    path: api-gateways/kong
    type: config
    maintainedBy: Community contributors
    status: active
    description: >-
      Validate Ory-issued JWTs or Kratos session cookies at the Kong API Gateway layer. JWTs via Kong's stock `jwt`
      plugin (or jwt-signer / jwt-keycloak community plugins for JWKS auto-refresh); session validation via
      request-transformer + pre-function calling /sessions/whoami. Documented at
      ory.com/docs/integrates-with/api-gateways/kong — universal pattern.
    useCase: >-
      A team running APIs behind Kong wants Ory-issued OAuth2 access tokens (Hydra) or Kratos session cookies validated
      at the gateway so backend services don't need to re-validate every request.
    coreFunctionality: |-
      - Path A (Hydra JWTs): Kong jwt plugin with RS256 algorithm, public key from Ory JWKS (prefer jwt-signer or jwt-keycloak community plugins for JWKS auto-fetch over manual key loading). Configure claims_to_verify (typically exp) and key_claim_name.
      - Path B (Kratos sessions): request-transformer + pre-function plugins (or a small custom plugin) call https://<project>.projects.oryapis.com/sessions/whoami with the session cookie; on 200 inject X-User-Id / X-User-Email headers downstream.
      - Kong Enterprise's OIDC plugin handles Path A automatically with JWKS auto-discovery.
      - Caching: cache whoami response per session cookie via Kong's proxy-cache plugin or a Redis-backed custom cache to avoid hammering Ory.
      - Rate-limit at the gateway keyed by the validated `sub` claim — Kong's rate-limiting plugin is the cleanest pattern.
      - Status: community/proposed — documented at ory.com/docs/integrates-with/api-gateways/kong.
    oryMechanism:
      - standards
    protocol:
      - jwt
      - rest-api
  - name: traefik
    displayName: Traefik
    vendor: Traefik
    category: api-gateways
    path: api-gateways/traefik
    type: session-validation
    maintainedBy: Community contributors
    status: active
    description: >-
      Traefik is a cloud-native reverse proxy and load balancer with native integrations for Docker and Kubernetes. This
      integration ships a small Ory session validator that plugs into Traefik's ForwardAuth middleware: Traefik calls
      the validator on every inbound request; the validator exchanges the user's session cookie or token for an
      /sessions/whoami lookup and returns identity headers (X-User-Id, X-User-Email, X-Auth-AAL, ...) that Traefik
      attaches to the upstream request.
    useCase: >-
      A platform team runs Traefik as the cluster's ingress and wants Ory to be the single authority on "who is calling
      this API?" without making each upstream service re-implement session validation. The validator centralizes session
      checks at the edge so unauthorized requests never reach the backend, and valid requests reach it with identity
      headers already populated.
    coreFunctionality: |-
      - Stateless HTTP service designed for Traefik's forwardAuth middleware (default port 4181).
      - On every request: forwards Cookie / Authorization / X-Session-Token to Ory's /sessions/whoami.
      - Sets X-User-Id, X-User-Email, X-User-Name, X-Session-Id, X-Auth-AAL, and X-User-Metadata response headers so Traefik can copy them onto the upstream request.
      - Public paths via ALLOWED_PATHS (exact match or prefix-with-slash, so /health doesn't accidentally match /healthadmin).
      - Optional LOGIN_REDIRECT_URL turns 401 into a 302 to the login page with return_to=<original-path> preserved.
      - 503 on Ory outages so Traefik surfaces a clear gateway error instead of treating an outage as "unauthorized".
    oryMechanism:
      - session-validation
    protocol:
      - rest-api
  - name: amplitude
    displayName: Amplitude
    vendor: Amplitude
    category: cdp-analytics
    path: cdp-analytics/amplitude
    type: config
    maintainedBy: Community contributors
    status: active
    description: >-
      Send Ory authentication events and user-property changes into Amplitude (product analytics). Ory Action POSTs
      directly to Amplitude's HTTP V2 API — no webhook handler needed; Amplitude API key authenticates the request.
    useCase: >-
      A consumer product wants identity events (registration / login / verification / MFA) in their Amplitude funnels
      and retention dashboards alongside in-product events — without standing up a webhook handler.
    coreFunctionality: |-
      - Pattern: Ory Action async (response.ignore: true) POSTs directly to https://api2.amplitude.com/2/httpapi (or https://api.eu.amplitude.com/2/httpapi for EU residency) — no handler in between.
      - Authentication: Amplitude API key included in the JSON body (api_key field).
      - Stable user_id: use Ory's identity id (ctx.identity.id), NOT email — Amplitude identity merges break if user_id changes across email updates.
      - User properties: $set operations track trait changes without overwriting Amplitude-computed dimensions.
      - Rate limits: 1,000 events per HTTP request; high-volume products should batch in a small handler instead of one-event-per-call.
      - Status: community/proposed — documented at ory.com/docs/integrates-with/cdp-analytics/amplitude.
    oryMechanism:
      - actions
    protocol:
      - rest-api
  - name: mailchimp
    displayName: Mailchimp (Marketing)
    vendor: Mailchimp
    category: cdp-analytics
    path: cdp-analytics/mailchimp
