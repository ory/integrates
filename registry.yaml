      - Ory Action on registration.after / settings.after calls Freshdesk POST /api/v2/contacts (or PUT for updates).
      - Auth: HTTP Basic with the API key as username and "X" as password (Freshdesk convention).
      - Optional: custom contact field ory_identity_id for stable cross-system lookup.
      - response.ignore: true — Freshdesk availability never blocks user flows.
      - 409 Conflict from POST means the contact already exists by email — handler should treat as success.
      - For Ory identity context shown inside Freshdesk tickets, consider a Freshdesk Marketplace App calling Ory's admin API — separate integration, not covered here.
      - Status: community/proposed — documented at ory.com/docs/integrates-with/support-helpdesk/freshdesk.
