  - name: plivo
    displayName: Plivo
    vendor: Plivo
    category: sms-providers
    path: sms-providers/plivo
    type: config
    maintainedBy: Community contributors
    status: active
    description: >-
      Use Plivo as the HTTP SMS courier for Ory Network OTPs and verification codes. Plivo is mentioned alongside Twilio
      in the Ory SMS docs as a supported HTTP courier target — a common pick when SMS unit economics matter.
    useCase: >-
      An Ory Network customer with high SMS volume wants to lower per-message cost without giving up direct-carrier
      delivery quality, or wants a second SMS provider for failover from Twilio.
    coreFunctionality: |-
      - Configured via Kratos's HTTP SMS courier (no code) per docs/kratos/emails-sms/sending-sms.
