  - name: launchdarkly
    displayName: LaunchDarkly
    category: feature-flags
    path: feature-flags/launchdarkly
    maintainedBy: Community contributors
    type: sdk-client
    description: >-
      LaunchDarkly is a feature-management platform for controlled rollouts, experiments, and runtime flag evaluation.
      This integration is a TypeScript helper (OryLaunchDarkly) that maps Ory session and identity data into
      LaunchDarkly's multi-kind context shape so feature-flag evaluation rules can target on Ory traits, metadata_public,
      and authenticator_assurance_level without ad-hoc mapping in every call site.
    status: active
    vendor: LaunchDarkly
    useCase: >-
      A product wants feature flags that target on identity attributes (subscription plan, role, MFA status) sourced from
      Ory. Rather than writing the Ory → LaunchDarkly context mapping in every request handler, the helper centralizes the
      mapping into one class and exposes typed boolVariation / stringVariation / numberVariation / jsonVariation /
      allFlagsState methods that accept an Ory session directly.
    coreFunctionality: >-
      - OryLaunchDarkly class wraps an LDClient, takes Ory session shape (id, identity, traits, metadata_public,
      authenticator_assurance_level).

      - Builds a LaunchDarkly multi-kind context: { user: {key=identity.id, email, firstName, lastName, plan,
      ...metadata}, session: {key=session.id, aal} }.

      - boolVariation / stringVariation / numberVariation / jsonVariation pass through to LDClient.variation with the
      constructed context.

      - allFlagsState lets you bootstrap client-side flag state for the current Ory session in one call.

      - Ships as an importable library (peer-depends on @launchdarkly/node-server-sdk ^9) — not a deployed HTTP service.
    oryMechanism:
      - sdk-client
