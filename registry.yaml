    vendor: OneTrust
    useCase: >-
      A regulated B2C product needs a defensible audit trail of consent (marketing, analytics, personalization) for every
      signup, plus a single button in the OneTrust UI that fulfills a deletion or export request across all downstream
      systems including the identity store.
    coreFunctionality: >-
      - Captures consent choices from transient_payload.consent on the sync post-registration webhook, returns them in
      metadata_public.consent immediately so Ory records the user's choices even if OneTrust is unreachable.

      - Exchanges OAuth2 client credentials for a OneTrust access token (cached in memory until 30 s before expiry) and
      POSTs a consent receipt to the Consent Manager API mapping each category to a configured Purpose ID.

      - Exposes a separate /onetrust/dsr endpoint gated by ONETRUST_DSR_SECRET that fulfills DELETE/ERASURE,
      EXPORT/ACCESS, and RECTIFICATION DSRs against Ory's Admin API.

      - Distinct shared secrets for the two surfaces so a leak of one credential can't be used to call the other.

      - Skips unmapped consent categories silently so partial Purpose ID configuration doesn't break registration.
    oryMechanism:
