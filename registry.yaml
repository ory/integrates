  - name: hookdeck
    displayName: Hookdeck
    vendor: Hookdeck
    category: webhook-infrastructure
    path: webhook-infrastructure/hookdeck
    type: config
    maintainedBy: Community contributors
    status: active
    description: >-
      Route Ory Network Action webhooks through Hookdeck for reliable delivery — managed ingestion, automatic retries
      with persistent storage, event replay from a dashboard, filtering, transformations, and per-delivery
      observability. Point Ory Action URL at Hookdeck Source; Hookdeck forwards to your handler with backoff / replay /
      filtering.
    useCase: >-
      A product team's Ory Action webhook handler has uptime concerns (deploys, regional outages, cold starts) and wants
      persistent event storage with replay capability — so Ory events never get lost during handler downtime and
      incident recovery is "click replay" instead of "rebuild state from logs."
    coreFunctionality: |-
      - Topology: Ory Action → Hookdeck Source → Hookdeck queue/retry → Hookdeck Destination → your handler.
      - Hookdeck is infrastructure, not an Ory event consumer — handler still does the work; Hookdeck adds reliability layer on top.
      - Configurable retry policy (typical: exponential backoff up to 24h) with persistent event storage.
      - Event replay from the dashboard — any historical event can be redelivered to the handler, useful for incident recovery.
      - Filtering drops events that don't matter (e.g. login.after for service-account identities) before they reach the handler.
      - Transformations reshape the Ory payload to match handler schema without touching either side.
      - Must pass through X-Webhook-Secret header so handler signature verification still works.
      - Compare with webhook-infrastructure/svix — similar product, different positioning (Svix is outbound webhooks; Hookdeck is inbound reliability).
      - Status: community/proposed — documented at ory.com/docs/integrates-with/webhook-infrastructure/hookdeck.
    oryMechanism:
      - standards
    protocol:
      - http-webhook
  - name: svix
    displayName: Svix
    vendor: Svix
    category: webhook-infrastructure
    path: webhook-infrastructure/svix
    type: webhook
    maintainedBy: Community contributors
    status: active
    description: >-
      Svix is a managed webhook-delivery platform that handles fan-out, retries with exponential backoff, payload
      signing, delivery monitoring, and replay. This integration routes Ory identity-flow events through Svix so
      multiple downstream consumers can subscribe to Ory events with operational guarantees Ory itself doesn't provide
      directly.
    useCase: >-
      A platform product wants to expose identity-lifecycle events to its own customers as webhooks but doesn't want to
      build webhook plumbing (retries, exponential backoff, replay, per-endpoint signing, dashboards, alerts). Ory
      Actions fire on the events; this router relays them to Svix, which fans out to consumer endpoints with
      at-least-once delivery.
    coreFunctionality: |-
      - Five async Ory Action endpoints (/svix/registration, /svix/login, /svix/settings, /svix/recovery, /svix/verification); each returns 200 immediately so user flows are never blocked.
      - Publishes to Svix's REST API (POST /api/v1/app/{appId}/msg/) with built-in fetch — no svix SDK dependency, consistent with the rest of the integration family.
      - Each message uses a deterministic eventId of ory-<eventType>-<flowId> so duplicates are deduped at the Svix layer.
      - Standardized event type names (ory.identity.registered, .logged_in, .updated, .recovery_initiated, .verified) so consumer endpoints filter cleanly.
      - Fire-and-forget: Svix outages and 5xx responses are logged but never propagate to Ory.
    oryMechanism:
      - actions
    protocol:
      - http-webhook
