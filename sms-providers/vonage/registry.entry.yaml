# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: vonage
displayName: Vonage (Nexmo)
vendor: Vonage
category: sms-providers
type: config
maintainedBy: Community contributors
description: >-
  Use Vonage (formerly Nexmo) as the HTTP SMS courier for Ory Network OTPs and verification codes. Strong EMEA
  and APAC carrier coverage and competitive international pricing make Vonage a common alternative to Twilio
  for products with significant non-US user bases.
useCase: >-
  An Ory Network customer with EMEA/APAC user concentration wants SMS delivery from a vendor strongest in those
  regions, in addition to or instead of US-centric Twilio.
coreFunctionality: |-
  - Configured via Kratos's HTTP SMS courier (no code) per docs/kratos/emails-sms/sending-sms.
  - Endpoint POST https://rest.nexmo.com/sms/json with HTTP Basic auth (API key : API secret) through the courier's basic_auth block.
  - Content-Type application/x-www-form-urlencoded; form fields from (alphanumeric ID up to 11 chars OR a Vonage virtual number — alphanumeric not allowed in US/Canada), to, text.
  - The Jsonnet template strips the leading "+" from Ory's E.164 recipient.
  - Newer Messages API (api.nexmo.com/v1/messages) available with JWT/header auth; the REST SMS API above is simpler for SMS-only use.
oryMechanism:
  - courier-spi
protocol:
  - rest-api
status: active
