# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: x-twitter
displayName: X / Twitter
vendor: X
category: social-sign-in
type: config
maintainedBy: Ory Engineering
description: >-
  Sign in with X (Twitter) as a social sign-in provider in Ory Network. Useful for consumer apps where Twitter/X is
  part of the audience graph — content discovery, social-adjacent products, creator tools.
useCase: >-
  A consumer or creator-tooling product wants sign-in via the OAuth provider its users use to follow / discover
  content. Twitter v2 free tier supports social sign-in without a paid API subscription.
coreFunctionality: |-
  - First-party Kratos OAuth2 provider — Ory provider id is `twitter` (not `x` or `x-twitter`); registry name `x-twitter` reflects the post-rebrand vendor name.
  - Confidential Client app type required (not Public Client); "Request email from users" toggle controls whether email is returned.
  - PKCE supported and enabled by default for the Twitter v2 OAuth flow.
  - Default Jsonnet maps the username and email when present.
  - Free Twitter Developer tier suffices — no paid subscription required for social sign-in.
oryMechanism:
  - standards
status: active
