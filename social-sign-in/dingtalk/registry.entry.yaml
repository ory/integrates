# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: dingtalk
displayName: DingTalk
vendor: Alibaba
category: social-sign-in
type: config
maintainedBy: Ory Engineering
description: >-
  DingTalk (钉钉) by Alibaba Group as a social sign-in provider in Ory Network. Enterprise communication platform
  widely used in mainland China; common for B2B and APAC enterprise products that want sign-in via the workplace
  identity their users already have.
useCase: >-
  A B2B SaaS or internal tool serving organizations in mainland China wants single-sign-on via the corporate
  collaboration platform that ~600M users are signed into during the workday.
coreFunctionality: |-
  - First-party Kratos OIDC provider (`provider: dingtalk`); CLI-only configuration today (no Ory Console wizard).
  - Supported scopes: `openid` (basic identity) or `openid corpid` (also returns the corporate identifier).
  - Default Jsonnet maps email when present; DingTalk doesn't surface verified-email semantics, so default mapping is conservative.
  - Configured via the DingTalk Open Platform — corporation-scoped apps require organization-side enablement.
oryMechanism:
  - standards
protocol:
  - oidc
status: active
