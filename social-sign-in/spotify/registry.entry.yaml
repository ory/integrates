# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: spotify
displayName: Spotify
vendor: Spotify
category: social-sign-in
type: config
maintainedBy: Ory Engineering
description: >-
  Spotify as a social sign-in provider in Ory Network. Users sign in with their Spotify account; Ory maps Spotify's
  OAuth2 response (id, email, display name, country, product tier) to the identity schema. Common in music,
  entertainment, and creator-tool products.
useCase: >-
  An entertainment or music-adjacent product wants sign-in via the OAuth provider its users already use to listen.
  Spotify's optional music-data scopes also enable personalization (recently-played, top tracks) when authorized.
coreFunctionality: |-
  - First-party Kratos OAuth2 provider (`provider: spotify`); Spotify is not OIDC, so Ory calls the Spotify API to populate the claims envelope.
  - Common scopes: user-read-email, user-read-private (basic identity); add music-data scopes for personalization.
  - Default Jsonnet maps email + display_name; can extend to country, product (free/premium), or Spotify URI.
  - Spotify apps start in Development mode with a 25-user whitelist; production requires Spotify approval.
  - Refresh tokens supported by default.
oryMechanism:
  - standards
status: active
