# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: kakao
displayName: Kakao
vendor: Kakao
category: social-sign-in
type: config
maintainedBy: Community contributors
description: >-
  Kakao Login as a social sign-in provider in Ory Network. Kakao is the dominant identity and messaging platform in
  South Korea; OIDC-compliant and configures as a generic OIDC provider in Ory.
useCase: >-
  A consumer product targeting South Korean users wants sign-in via the platform that nearly every Korean smartphone
  user has installed for messaging, payments, and identity.
coreFunctionality: |-
  - Configured via Ory's "Add a Generic Provider" Console wizard (or `provider: generic` in the CLI) after turning on Kakao Login and OpenID Connect for the app.
  - Issuer URL: https://kauth.kakao.com.
  - Scopes: openid, profile_nickname, profile_image, account_email; each consent item must be configured on the app, and some require additional Kakao permissions such as business verification.
  - Ory requires the client secret of the REST API key.
  - The ID token carries sub, plus nickname, picture, and email when the user consents; there is no email_verified claim.
  - Status: community/proposed — documented at ory.com/docs/integrates-with/social-sign-in/kakao; contributions welcome.
oryMechanism:
  - standards
protocol:
  - oidc
status: active
