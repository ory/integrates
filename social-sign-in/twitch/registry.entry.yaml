# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: twitch
displayName: Twitch
vendor: Twitch
category: social-sign-in
type: config
maintainedBy: Ory Engineering
description: >-
  Twitch as a social sign-in provider in Ory Network. Common in gaming, streaming, and creator-tooling products. Twitch
  publishes an OIDC discovery URL but doesn't return an id_token — Ory calls Twitch's /me API and surfaces the user
  info as claims for Jsonnet mapping.
useCase: >-
  A gaming, streaming, or creator-tooling product wants sign-in via the OAuth provider its viewers and streamers
  already use. Optional Twitch scopes (channel info, follows, subscriptions) enable feature gating on creator tier.
coreFunctionality: |-
  - Configured as a generic OIDC provider (`provider: generic`, `id: twitch`, issuer https://id.twitch.tv/oauth2) — there is no first-party `twitch` provider in Kratos. CLI-only configuration.
  - Twitch publishes /.well-known/openid-configuration but the `openid` claim isn't returned in the access_token; Ory hits Twitch's /me API to populate the claims envelope.
  - Default Jsonnet returns email gated on email_verified.
  - Configured via the Twitch Developer Portal; scopes follow the Twitch Helix scope catalog.
oryMechanism:
  - standards
protocol:
  - oidc
status: active
