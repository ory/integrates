# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: salesforce
displayName: Salesforce
vendor: Salesforce
category: social-sign-in
type: config
maintainedBy: Ory Engineering
description: >-
  Salesforce as a social sign-in provider in Ory Network. Salesforce is OIDC-compliant; the integration is useful for
  B2B products in the Salesforce ecosystem where reps and admins should sign in with their existing Salesforce account.
useCase: >-
  A B2B SaaS or partner portal integrated with the Salesforce ecosystem wants single-sign-on via the CRM seat its
  users already have. The access_token can be reused server-side to call Salesforce APIs on behalf of the user.
coreFunctionality: |-
  - First-party Kratos OIDC provider (`provider: salesforce`); both Console wizard and CLI configurations supported.
  - Salesforce Connected App with `openid`, `profile`, `email` scopes; PKCE must be disabled (Kratos doesn't support PKCE for this provider) and "Require Secret for Web Server Flow" enabled.
  - Tenant URL is mandatory in the Ory Console form (typically https://<tenant>.my.salesforce.com) for issuer validation.
  - Default Jsonnet returns email gated on email_verified; maps `nickname` → `username`.
oryMechanism:
  - standards
status: active
