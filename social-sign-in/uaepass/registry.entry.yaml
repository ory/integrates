# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: uaepass
displayName: UAE PASS
vendor: UAE PASS
category: social-sign-in
type: config
maintainedBy: Ory Engineering
description: >-
  UAE PASS as a social sign-in provider in Ory Network. UAE PASS is the United Arab Emirates' official digital identity
  platform for nationals, residents, and visitors; OIDC-compliant and required for products serving UAE residents.
useCase: >-
  A consumer or government-adjacent product operating in the UAE wants sign-in via the national digital identity
  service that residents already use to access government and licensed private-sector services.
coreFunctionality: |-
  - First-party Kratos OIDC provider (`provider: uaepass`); both Console wizard and CLI configurations supported.
  - Issuer URL is environment-specific: https://id.uaepass.ae for production, https://stg-id.uaepass.ae for staging.
  - Default Jsonnet maps sub → subject, email → email, fullnameEN → name.
  - Onboarding is gated — applications must be registered with the UAE PASS partner portal and approved before going live.
  - Supports both web and mobile authentication flows; mobile-app handoff to the UAE PASS app is documented on the partner portal.
oryMechanism:
  - standards
status: active
