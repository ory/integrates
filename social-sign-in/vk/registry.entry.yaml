# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: vk
displayName: VKontakte
vendor: VK
category: social-sign-in
type: config
maintainedBy: Ory Engineering
description: >-
  VKontakte (VK) as a social sign-in provider in Ory Network. The dominant Russian-language social network — the
  natural sign-in option for consumer products targeting Russia and CIS markets.
useCase: >-
  A consumer product targeting Russian-speaking users wants sign-in via the OAuth provider those users use as their
  primary social network. Often paired with the Yandex provider for broader CIS coverage.
coreFunctionality: |-
  - First-party Kratos OAuth2 provider (`provider: vk`); CLI-only configuration.
  - VK returns an access_token only (no id_token); Ory calls VK's users.get API to populate the claims envelope.
  - Default Jsonnet maps email when present (VK doesn't expose email_verified, so the default is conservative — `email` scope is required for any chance of getting it).
  - Configured via the VK developers portal (vk.com/apps?act=manage); App ID = Client ID, Secure key = Client Secret.
  - Optional VK scopes for friends list, photos, etc. — enable per app needs.
oryMechanism:
  - standards
protocol:
  - oauth2
status: active
