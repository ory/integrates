# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: battle-net
displayName: Battle.net
vendor: Blizzard Entertainment
category: social-sign-in
type: config
maintainedBy: Community contributors
description: >-
  Battle.net (Blizzard) as a social sign-in provider in Ory Network. Battle.net supports OpenID Connect and
  configures as a generic OIDC provider; no Battle.net-specific Ory page yet — pattern follows the generic-OIDC docs.
useCase: >-
  A gaming product targeting Blizzard's player base (World of Warcraft, Overwatch, Hearthstone, Diablo) wants sign-in
  via the OAuth provider its players already use to access their games and battle.tag identity.
coreFunctionality: |-
  - Configured via Ory's "Add a Generic Provider" Console wizard (or `provider: generic` in the CLI) — Battle.net supports OpenID Connect discovery.
  - Issuer URL: https://oauth.battle.net; the China region uses https://oauth.battlenet.com.cn.
  - Scope: openid.
  - Battle.net doesn't release email addresses. Jsonnet maps `sub` (numeric account ID) and, when present, `raw_claims.battle_tag`; the identity schema must not require an email address.
  - Status: community/proposed — documented at ory.com/docs/integrates-with/social-sign-in/battle-net; contributions welcome.
oryMechanism:
  - standards
protocol:
  - oidc
status: active
