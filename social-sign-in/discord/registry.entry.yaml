# This file is the source of truth for this integration's registry metadata.
# Run `node scripts/build-registry.js` from the repo root to regenerate registry.yaml.

name: discord
displayName: Discord
vendor: Discord
category: social-sign-in
type: config
maintainedBy: Ory Engineering
description: >-
  Discord as a social sign-in provider in Ory Network. Users sign in with their Discord account; Ory maps Discord's
  OAuth2 response (user ID, username, email and its verification status, avatar, locale) to the identity schema. Common in gaming,
  community, and creator-facing products.
useCase: >-
  A gaming or community product wants sign-in via the OAuth provider its users already use to chat with each other —
  Ory doesn't fetch guild membership; read it from the Discord API in application code if needed.
coreFunctionality: |-
  - First-party Kratos OAuth2 provider (`provider: discord`).
  - Standard scopes: identify (username + ID) and email. Ory doesn't fetch guild (server) membership.
  - Default Jsonnet maps email and identifier; can extend to avatar, username, or locale.
  - Discord OAuth applications are configured under the Discord Developer Portal; no Discord-side approval needed beyond enabling OAuth2.
  - Refresh tokens supported by default — the access token has limited TTL.
oryMechanism:
  - standards
protocol:
  - oidc
status: active
