# Svix event routing hooks.
#
# All five hooks are fire-and-forget (response.ignore: true, can_interrupt:
# false). The handler returns 200 to Ory immediately and publishes the event
# to Svix in the background; Svix availability never blocks user flows.

selfservice:
  flows:
    registration:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-deployed-handler.example.com/svix/registration
              method: POST
              body: file://./jsonnet/event.jsonnet
              can_interrupt: false
              response:
                ignore: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: <your-shared-secret>
                  in: header
    login:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-deployed-handler.example.com/svix/login
              method: POST
              body: file://./jsonnet/event.jsonnet
              can_interrupt: false
              response:
                ignore: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: <your-shared-secret>
                  in: header
    settings:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-deployed-handler.example.com/svix/settings
              method: POST
              body: file://./jsonnet/event.jsonnet
              can_interrupt: false
              response:
                ignore: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: <your-shared-secret>
                  in: header
    recovery:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-deployed-handler.example.com/svix/recovery
              method: POST
              body: file://./jsonnet/event.jsonnet
              can_interrupt: false
              response:
                ignore: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: <your-shared-secret>
                  in: header
    verification:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-deployed-handler.example.com/svix/verification
              method: POST
              body: file://./jsonnet/event.jsonnet
              can_interrupt: false
              response:
                ignore: true
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: <your-shared-secret>
                  in: header
