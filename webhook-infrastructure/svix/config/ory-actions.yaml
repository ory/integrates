# Ory Actions configuration for Svix event routing.
# All hooks are async (fire-and-forget) — events are buffered by the router
# and published to Svix for reliable fan-out delivery.

selfservice:
  flows:
    registration:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-webhook-handler.example.com/webhooks/svix/registration
              method: POST
              body: file:///config/jsonnet/event.jsonnet
              response:
                ignore: true
              can_interrupt: false
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: YOUR_WEBHOOK_SECRET
                  in: header
    login:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-webhook-handler.example.com/webhooks/svix/login
              method: POST
              body: file:///config/jsonnet/event.jsonnet
              response:
                ignore: true
              can_interrupt: false
              auth:
