              response:
                ignore: true
              can_interrupt: false
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: YOUR_WEBHOOK_SECRET
                  in: header
    recovery:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-webhook-handler.example.com/webhooks/svix/recovery
              method: POST
              body: file:///config/jsonnet/event.jsonnet
              response:
                ignore: true
              can_interrupt: false
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: YOUR_WEBHOOK_SECRET
                  in: header
    verification:
      after:
        hooks:
          - hook: web_hook
            config:
              url: https://your-webhook-handler.example.com/webhooks/svix/verification
              method: POST
              body: file:///config/jsonnet/event.jsonnet
